name: image

# Build and publish the metaserve container image (API server + the static site)
# to GHCR. Runs on a v* tag push and on manual dispatch. Data-only releases are
# handled by release.yml; this ships the server itself.
#
# The image carries NO data: metaserve fetches the newest data release at boot
# (see Dockerfile). So this workflow never validates or compiles the catalogue,
# its build time is independent of catalogue size, and a data release needs no
# new image.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Least privilege: read the code, write packages (the image). No release/contents
# write is needed.
permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    # Observed up to ~8 minutes with a warm layer cache; a cold one rebuilds the
    # site and the Go binary from scratch.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The registry login is its own credential and require-on-main.sh
          # fetches a public repository anonymously; nothing needs the token in
          # .git/config.
          persist-credentials: false

      - name: Refuse a tag that is not on main
        # `v*` matches any tag on any commit, and this workflow publishes to
        # GHCR under names people deploy from - so a tag pushed onto a branch, a
        # revert or an unreviewed commit would ship as a released image. Shared
        # with release.yml's dispatch guard; the mechanism is in the script's
        # header.
        run: bash .github/scripts/require-on-main.sh "Tag a commit that has been merged to main."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/kodestar/audiosilo-meta
          # `latest` is what an unpinned deployment pulls, so a PRERELEASE must
          # never move it: v1.2.3-rc1 publishes under its own tag and nothing
          # else. A hyphen in the ref name is the semver prerelease marker, and
          # it is the whole test - this repo cuts no `v1.2.3-something` tag that
          # is meant to be the current release.
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Supply-chain attestations, so a published image can say what it was
          # built from and what is in it. The Dockerfile pins every base image by
          # digest; these record the result.
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
