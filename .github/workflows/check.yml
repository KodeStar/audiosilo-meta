name: check

# Validate every pull request and every push to main.
#
# SECURITY: this uses the plain `pull_request` trigger, NOT
# `pull_request_target`, so fork pull requests run with a read-only token and no
# access to secrets. Do not switch to `pull_request_target` (the "pwn request"
# supply-chain pattern) - any privileged follow-up must live in a separate
# workflow that consumes only artifacts.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: read the code, nothing more. No secrets are needed to validate.
permissions:
  contents: read

# One live validation per pull request. The intake sweep force-pushes every open
# bot-intake pull request on each data merge to main, and without a group each
# force-push stacked a fresh full run behind the last - one merge queued a run
# per open intake PR, and a string of merges multiplied that by the number of
# merges. A superseded head's run validates a tree that can no longer be merged,
# so it is cancelled. Pushes to main are never grouped or cancelled (the sha
# group is unique per push): every commit that lands on main gets its own
# complete validation.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # WHICH JOBS THE DIFF CAN MOVE, decided once for all of them.
  #
  # Most pull requests here are the intake and sync bots', and a tranche of pack
  # files cannot change what `go vet` or the race detector say - so the Go gate
  # (build/vet/test/lint/vuln) is skipped for a diff that is only data and prose,
  # and the compose job keeps the narrower probe it always had. metacheck and
  # metafmt are NOT gated: they are the data's own check.
  #
  # The rules, the fail-open and why this is an output rather than a `paths:`
  # filter are all in .github/scripts/pr-changes.sh. The checkout is blobless and
  # sparse because the script is the only file this job needs and the data tree
  # is gigabytes.
  changes:
    runs-on: ubuntu-latest
    # A single API listing; observed well under a minute.
    timeout-minutes: 5
    outputs:
      go: ${{ steps.classify.outputs.go }}
      compose: ${{ steps.classify.outputs.compose }}
    steps:
      - name: Checkout the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          filter: blob:none
          # No job in this workflow talks to a remote after its checkout (this
          # one reads the diff through gh, not git), so none keeps the token in
          # .git/config - and every one of them runs a pull request's code, a
          # fork's included.
          persist-credentials: false

      - name: Classify the diff
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/pr-changes.sh

  # THE GATE IS SPREAD OVER PARALLEL JOBS, and `check` (below) is the one that
  # waits for them all and gives the verdict.
  #
  # It used to be one job: build, vet, `go test -race`, metacheck, metafmt and the
  # advisory delta in sequence, ~10-12 minutes on a pull request carrying both
  # code and a large data change (716 s on the LibriVox tranche 1, #2763) and
  # growing with the tree. Now each is its own runner: build+vet, three test
  # shards, metacheck, metafmt and the advisory base, so the wall time is the
  # slowest of them rather than their sum. Nothing was dropped: every step the
  # old job ran runs, over the same tree, under the same gating.
  #
  # The jobs that only need Go code (build, lint, vuln) and the site check out a
  # SPARSE, blobless tree without data/ - its 1.7 GB is most of every full
  # checkout's ~2 minutes, and data/ is its own module (data/go.mod), so `./...`
  # never reaches it. The test shards, metacheck, metafmt and the advisory base
  # read data/ and check out the whole tree.
  #
  # Each gated step tees its output to a log that is uploaded when the job fails,
  # and `check` prints those logs last (.github/scripts/check-verdict.sh says why:
  # the sync bot reads the tail of the failed `check` log as its evidence).
  build:
    runs-on: ubuntu-latest
    needs: changes
    # Build and vet alone, without the data checkout: observed ~1 minute.
    timeout-minutes: 15
    steps:
      - name: Checkout (no data/)
        if: needs.changes.outputs.go == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/data/
          sparse-checkout-cone-mode: false
          filter: blob:none
          persist-credentials: false

      - name: Set up Go
        if: needs.changes.outputs.go == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # .go-version holds the bare MINOR and check-latest resolves it to the
          # newest patch; go.mod's `go` line is a floor, not the toolchain
          # (PACKAGES.md, the `.github/` entry).
          go-version-file: .go-version
          check-latest: true

      # Go steps only: a data-and-prose diff skips them (see the changes job).
      - name: Build and vet
        if: needs.changes.outputs.go == 'true'
        run: |
          set -o pipefail
          { go build ./... && go vet ./...; } 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Keep the log for the verdict
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-log-build
          path: ${{ runner.temp }}/build.log
          retention-days: 3
          if-no-files-found: ignore

  # `go test -race ./...`, in three shards. .github/scripts/go-test-shard.sh
  # partitions `go list ./...` so every package runs in exactly one shard
  # (scripts/gotestshard_test.go pins that, and that this matrix names shards 1
  # to 3), balanced on measured per-package times. -race, as the documented gate
  # is. Every real-data test skips under the detector (race_{on,off}_test.go in
  # pkg/check, pkg/canonical, internal/importer and internal/repair) - the
  # fixture suites cover the concurrent code and the real tree is data coverage,
  # validated by metacheck/metafmt below - so the suite stays inside a few
  # minutes. The real-data tests themselves run without -race in real-data.yml.
  # The checkout is the whole tree at depth 2: internal/recorddiff's
  # TestAgainstTheRealCheckout reads HEAD~1..HEAD of data/ through git.
  test:
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      # Every shard reports, so a failure's evidence is complete.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # The whole -race suite in one job was observed up to ~5 minutes plus a
    # ~2 minute checkout; a shard is a third of it. About twice the old whole.
    timeout-minutes: 20
    steps:
      - name: Checkout
        if: needs.changes.outputs.go == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Go
        if: needs.changes.outputs.go == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # .go-version holds the bare MINOR and check-latest resolves it to the
          # newest patch; go.mod's `go` line is a floor, not the toolchain
          # (PACKAGES.md, the `.github/` entry).
          go-version-file: .go-version
          check-latest: true

      - name: Test (shard ${{ matrix.shard }} of 3)
        if: needs.changes.outputs.go == 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          go list ./... | bash .github/scripts/go-test-shard.sh "$SHARD" 3 > "$RUNNER_TEMP/packages.txt"
          if [ ! -s "$RUNNER_TEMP/packages.txt" ]; then
            # An empty shard would make `go test` test the current directory
            # alone and pass; the partition has a package for every shard.
            echo "::error::shard $SHARD of 3 holds no package"
            exit 1
          fi
          echo "shard $SHARD of 3: $(wc -l < "$RUNNER_TEMP/packages.txt") packages"
          xargs go test -race < "$RUNNER_TEMP/packages.txt" 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Keep the log for the verdict
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-log-test-${{ matrix.shard }}
          path: ${{ runner.temp }}/test.log
          retention-days: 3
          if-no-files-found: ignore

  # --profile core is what this repository's data root now IS: works, people,
  # series and redirects.json, with the CC BY-SA layer living in
  # KodeStar/audiosilo-meta-community. It is passed explicitly rather than
  # changed as a flag default, because the tools still serve a whole-database
  # tree ("all") and a community-only one. The teeth are the file accounting:
  # under `core` a works-community/ directory that reappears here - a bad
  # merge, a stray revert, a misdirected contribution - is an unrecognized
  # location and a RED check, instead of a family silently re-adopted.
  # The advisory keys are this tree's half of the advisory delta `check` prints;
  # the flag changes nothing about the check itself. NOT gated on the diff:
  # metacheck and metafmt are the data's own check.
  metacheck:
    runs-on: ubuntu-latest
    needs: changes
    # Observed ~2 minutes of checkout plus ~1.5-2.5 minutes of metacheck over
    # 283k works; the tree grows. About twice that.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # .go-version holds the bare MINOR and check-latest resolves it to the
          # newest patch; go.mod's `go` line is a floor, not the toolchain
          # (PACKAGES.md, the `.github/` entry).
          go-version-file: .go-version
          check-latest: true

      - name: Validate data (metacheck)
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/advisories"
          go run ./cmd/metacheck --profile core --advisory-keys "$RUNNER_TEMP/advisories/head.txt" 2>&1 | tee "$RUNNER_TEMP/metacheck.log"

      # The head half of the advisory delta, for `check`. Written whatever the
      # tree's problems (metacheck's contract), and never a failure.
      - name: Hand on the advisory keys
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: advisories-head
          path: ${{ runner.temp }}/advisories/head.txt
          retention-days: 3
          if-no-files-found: ignore

      - name: Keep the log for the verdict
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-log-metacheck
          path: ${{ runner.temp }}/metacheck.log
          retention-days: 3
          if-no-files-found: ignore

  metafmt:
    runs-on: ubuntu-latest
    needs: changes
    # Observed ~2 minutes of checkout plus ~1.5-2.5 minutes of metafmt before it
    # parsed and rendered on every core (pkg/canonical, pkg/pack through
    # internal/parallel); now well under a minute. About twice the old whole.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # .go-version holds the bare MINOR and check-latest resolves it to the
          # newest patch; go.mod's `go` line is a floor, not the toolchain
          # (PACKAGES.md, the `.github/` entry).
          go-version-file: .go-version
          check-latest: true

      - name: Check canonical formatting (metafmt)
        run: |
          set -o pipefail
          go run ./cmd/metafmt --check --profile core 2>&1 | tee "$RUNNER_TEMP/metafmt.log"

      - name: Keep the log for the verdict
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-log-metafmt
          path: ${{ runner.temp }}/metafmt.log
          retention-days: 3
          if-no-files-found: ignore

  # THE ADVISORIES THIS PULL REQUEST INTRODUCES, the base half: the same
  # metacheck over the BASE (the merge commit's first parent), whose keys `check`
  # compares with the head's from the metacheck job (.github/scripts/
  # advisory-delta.sh says why and what counts; ai-verify.yml hands the same
  # list to the model). Its own runner so the second whole-tree metacheck runs
  # beside the first instead of after it.
  # NEVER A FAILURE, twice over: the advisories are not a gate (the sync bot
  # auto-merges on green CI), so every step continues on error and `check` never
  # counts this job. Pull requests only - a push to main has no "introduced by" -
  # and a pull request touching no data/ says so instead, since the same binary
  # over the same data names the same advisories.
  advisories:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request'
    # Observed ~2 minutes of checkout plus ~1.5-2.5 minutes of metacheck.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits: the checkout is GitHub's test MERGE commit, and its
          # first parent is the base compared against.
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # .go-version holds the bare MINOR and check-latest resolves it to the
          # newest patch; go.mod's `go` line is a floor, not the toolchain
          # (PACKAGES.md, the `.github/` entry).
          go-version-file: .go-version
          check-latest: true

      - name: Advisory keys of the base
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/advisories"
          if git diff --quiet HEAD^1 HEAD -- data/; then
            echo "No data change, so no advisory can be new."
            echo "base and head hold the same data/" > "$RUNNER_TEMP/advisories/no-data-change"
            exit 0
          fi
          go build -o "$RUNNER_TEMP/metacheck" ./cmd/metacheck
          bash .github/scripts/advisory-delta.sh keys "$RUNNER_TEMP/metacheck" HEAD^1 "$RUNNER_TEMP/advisories/base.txt"

      - name: Hand on the advisory keys
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: advisories-base
          path: ${{ runner.temp }}/advisories/
          retention-days: 3
          if-no-files-found: ignore

  # THE VERDICT, under the name everything downstream reads: branch protection
  # requires `check`, and audiosilo-meta-sync merges its pull requests once
  # `check`, `compose`, `site` and `verify` are green. It needs every job of the
  # gate above and passes only when each concluded `success`
  # (.github/scripts/check-verdict.sh); `advisories` is waited for, for the
  # summary, and never counted. `!cancelled()` rather than `always()`: a run
  # superseded by a newer push is cancelled, and its verdict with it.
  check:
    runs-on: ubuntu-latest
    needs: [changes, build, test, metacheck, metafmt, advisories]
    if: ${{ !cancelled() }}
    # Two downloads and a comparison; observed well under a minute.
    timeout-minutes: 10
    steps:
      - name: Checkout the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          filter: blob:none
          persist-credentials: false

      - name: Fetch the advisory keys
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: advisories-*
          path: ${{ runner.temp }}/advisories

      # The advisories this pull request introduces, in this job's summary: what
      # the merged tree names that the base did not. NEVER A FAILURE
      # (continue-on-error), as before the split.
      - name: Advisories this pull request introduces
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/advisories"
          if [ -f "$dir/advisories-base/no-data-change" ]; then
            echo "No data change, so no advisory can be new."
            exit 0
          fi
          bash .github/scripts/advisory-delta.sh diff "$dir/advisories-base/base.txt" "$dir/advisories-head/head.txt" > "$RUNNER_TEMP/advisories-new.txt"
          bash .github/scripts/advisory-delta.sh summary "$RUNNER_TEMP/advisories-new.txt" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/advisories-new.txt"

      - name: Fetch the failed jobs' logs
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: check-log-*
          path: ${{ runner.temp }}/logs

      - name: Verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bash .github/scripts/check-verdict.sh "$RUNNER_TEMP/logs" advisories

  # The other half of the documented gate (CLAUDE.md): `golangci-lint run`.
  # It was documented and run by hand but never by CI, so the green baseline the
  # guide promises rested on somebody remembering. Its own job because linting
  # and testing are independent and parallel jobs finish sooner. The linter
  # version is pinned rather than `latest`: a new release adds checks, and a
  # baseline that goes red on a day nobody changed Go code is a broken gate.
  lint:
    runs-on: ubuntu-latest
    needs: changes
    # Observed up to ~5 minutes, most of it the full checkout this no longer
    # makes.
    timeout-minutes: 15
    # Every step is gated, so a data-and-prose diff reports this job green
    # without checking anything out - the required check still reports.
    steps:
      - name: Checkout (no data/)
        if: needs.changes.outputs.go == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/data/
          sparse-checkout-cone-mode: false
          filter: blob:none
          persist-credentials: false

      - name: Set up Go
        if: needs.changes.outputs.go == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # .go-version holds the bare MINOR and check-latest resolves it to the
          # newest patch; go.mod's `go` line is a floor, not the toolchain
          # (PACKAGES.md, the `.github/` entry).
          go-version-file: .go-version
          check-latest: true

      - name: golangci-lint
        if: needs.changes.outputs.go == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12

  # Known-vulnerability scan over the module and the toolchain it builds with.
  #
  # STRICT on purpose - a reachable advisory is a red check, not a note.
  vuln:
    runs-on: ubuntu-latest
    needs: changes
    # Observed up to ~5 minutes, most of it the full checkout this no longer
    # makes.
    timeout-minutes: 15
    steps:
      - name: Checkout (no data/)
        if: needs.changes.outputs.go == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/data/
          sparse-checkout-cone-mode: false
          filter: blob:none
          persist-credentials: false

      - name: Set up Go
        if: needs.changes.outputs.go == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # .go-version holds the bare MINOR and check-latest resolves it to the
          # newest patch; go.mod's `go` line is a floor, not the toolchain
          # (PACKAGES.md, the `.github/` entry).
          go-version-file: .go-version
          check-latest: true

      - name: govulncheck
        if: needs.changes.outputs.go == 'true'
        # Run directly and PINNED rather than through golang/govulncheck-action,
        # which installs golang.org/x/vuln/cmd/govulncheck@latest: each x/vuln
        # release declares a recent Go floor, so @latest breaks this job the day
        # a release outruns the Go minor in .go-version. Dependabot's gomod
        # ecosystem does not see a version inside a `go run` argument, so this
        # pin is one of the four places a Go bump edits by hand: go.mod,
        # .go-version, the Dockerfile's golang image and this line.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # The CROSS-TREE half of validation, which no single-root check can perform.
  #
  # `metacheck --profile core` above judges this repository's tree alone. The
  # rules that span the two repositories - a community sidecar keyed by a work
  # this core does not hold, a key riding a redirect, two sidecars of one kind
  # resolving onto one work - can only be asked where BOTH trees are present, and
  # until now that was only the release build. So a core PR that retired or
  # deleted a sidecar-keyed work went green here and broke the RELEASE STREAM
  # after merge, for everyone, with the fix needing a second PR.
  #
  # This job is the pre-merge half of that same build: the exact composition
  # release.yml performs, run at PR time, failing on a non-zero exit. It should be
  # REQUIRED, not advisory - its whole point is to be the thing that stops the
  # merge.
  #
  # The community checkout is public and read-only (github.token, no secret), and
  # the artifact goes to the runner temp: nothing is published and nothing is
  # cached. It floats on the community repo's `main` deliberately - that is what
  # the release will compose against, so a core change that breaks the pair should
  # go red the moment either side makes it true.
  # PULL REQUESTS ONLY: on push to main the identical compose runs minutes later
  # as the release build itself, which is the authoritative gate - composing here
  # too would build every data merge twice for no extra signal. And within a PR
  # it SELF-SKIPS (the site job's required-check-compatible pattern) unless the
  # diff touches something that can change the compose's answer: the same path
  # set release.yml releases on, plus this workflow itself. That question is the
  # changes job's `compose` output now, decided from the same listing the Go
  # gate's is - and, unlike the inline probe it replaces, failing OPEN.
  compose:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request'
    # Observed up to ~8 minutes: two checkouts and a full compose of the
    # 1.7 GB artifact, which grows with the catalogue.
    timeout-minutes: 20
    steps:
      - name: Checkout
        if: needs.changes.outputs.compose == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout the community layer
        if: needs.changes.outputs.compose == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KodeStar/audiosilo-meta-community
          ref: main
          path: community
          persist-credentials: false

      - name: Set up Go
        if: needs.changes.outputs.compose == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # .go-version holds the bare MINOR and check-latest resolves it to the
          # newest patch; go.mod's `go` line is a floor, not the toolchain
          # (PACKAGES.md, the `.github/` entry).
          go-version-file: .go-version
          check-latest: true

      - name: Compose both trees (metabuild --community)
        if: needs.changes.outputs.compose == 'true'
        # Building rather than only checking is deliberate: the compose rules run
        # inside the loader metabuild drives (check.LoadComposed), so this IS the
        # check, and going all the way to an artifact additionally exercises the
        # builder over the composed catalogue - the same work release.yml does, so
        # a green run here means the release can be cut.
        run: go run ./cmd/metabuild -data data --community community/data -o "$RUNNER_TEMP/meta.sqlite"

  # Build and typecheck the marketing/search site. This job is intentionally
  # unconditional (branch protection can require it), but it self-skips cleanly
  # when site/ is absent, so it stays green before the site lands and gates it
  # once it does. No `paths:` filter - a required check must always report.
  site:
    runs-on: ubuntu-latest
    # Observed up to ~6 minutes, the full checkout it no longer makes and a cold
    # yarn install dominating.
    timeout-minutes: 15
    steps:
      # No data/: the site reads none of it (its pages call the API), and the
      # data tree was most of this job's time.
      - name: Checkout (no data/)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/data/
          sparse-checkout-cone-mode: false
          filter: blob:none
          persist-credentials: false

      - name: Check for site/
        id: site
        run: |
          if [ -f site/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "site/ not present yet; skipping."
          fi

      - name: Set up Node
        if: steps.site.outputs.exists == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install, build, typecheck, and test the site
        if: steps.site.outputs.exists == 'true'
        working-directory: site
        run: |
          yarn install --frozen-lockfile
          yarn build
          yarn run check
          yarn test
