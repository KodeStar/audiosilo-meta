# Production-shaped deployment: the image bundles the API server (metaserve) and
# the static site - NO data. On boot it downloads the newest published data
# release, then accepts signed refresh notifications and polls GitHub Releases as
# a fallback, so data updates need no redeploy - only code changes do.
#
# If GitHub is unreachable at boot the container stays up and retries - first
# after 30s, then backing off to the poll interval: the site is served, /healthz
# answers 503 `{"status":"starting"}` and the API answers 503 until a release
# loads. Watch the logs, not a restart count.
#
# Put a TLS-terminating reverse proxy (nginx, Caddy, Ploi) in front:
# proxy https://meta.example.com -> 127.0.0.1:8080. Health check: GET /healthz
# (200 only once data is loaded - it is a readiness check).
services:
  meta:
    image: ghcr.io/kodestar/audiosilo-meta:latest
    restart: unless-stopped
    # Loopback-only on purpose - the reverse proxy is the public face. The
    # container side is always 8080; change only the HOST side if that port is
    # taken (e.g. "127.0.0.1:8081:8080").
    ports:
      - "127.0.0.1:8080:8080"
    # The image runs as a fixed non-root user and only writes under /data.
    # There is no PUID/PGID mechanism (nothing to su-exec); with a bind mount,
    # set `user:` to the host owner's uid:gid instead:
    # user: "1001:1001"
    volumes:
      # The live data artifact lives here. It is a disposable cache: a boot
      # always fetches the newest release afresh (the first refresh has nothing
      # to patch against), so persisting this does not speed startup - it
      # provides the patch base that lets LATER refreshes transfer a delta
      # instead of the whole artifact. A named volume or a bind mount (e.g.
      # /home/you/containers/audiosilo-meta/data:/data, pre-chowned to the
      # `user:` above) both work.
      #
      # Sizing: steady state is one artifact (superseded ones are pruned once
      # the swap grace elapses). Peak, during a refresh, is the old artifact
      # plus the new one - plus the patch file on the delta path, which is
      # small. Allow room for two artifacts. The download itself is streamed
      # straight into the new artifact, so no compressed copy is ever staged.
      - meta-cache:/data
    # The image entrypoint already runs:
    #   metaserve --site /app/site --poll --cache /data/cache
    # `command:` APPENDS flags to that, e.g. a faster poll cadence:
    # command: ["--interval", "15m"]
    environment:
      # The API is rate limited per client (100 requests a second, burst 400,
      # sized so an AudioSilo server's bulk match never trips it;
      # METASERVE_RATE_LIMIT / METASERVE_RATE_BURST; a rate of 0 turns it off,
      # a burst of 0 with the limit on is refused at startup).
      #
      # The client is the connection's address unless that address is a trusted
      # proxy, and behind the reverse proxy every connection comes from the
      # proxy: a host proxy reaching the loopback port above arrives from the
      # compose network's GATEWAY, an address inside that network's subnet
      # (127.0.0.1 only under network_mode: host). Trusting exactly that subnet
      # and the loopback lets the limit read the proxy's X-Forwarded-For, so
      # each visitor gets their own bucket rather than the whole site sharing
      # one - and trusts nothing else. The subnet is PINNED (networks: below) so
      # the trusted range is known rather than whatever Docker allocated; both
      # read METASERVE_SUBNET, so they cannot disagree. Override it in .env when
      # the default collides with a network on this host (`docker compose up`
      # then refuses with "Pool overlaps"), e.g. METASERVE_SUBNET=10.99.0.0/28.
      #
      # Do NOT widen this to the private ranges (10/8, 172.16/12, 192.168/16):
      # if the host proxy also serves a LAN, a LAN client's own address is then
      # a "trusted proxy" hop, so the X-Forwarded-For it sends is believed and it
      # can pick any bucket it likes. The proxy must send X-Forwarded-For (nginx:
      # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for). If another
      # proxy or CDN sits in front of it, add that CDN's ranges too, or rewrite
      # the header at the host proxy (nginx real_ip), or the CDN's edges become
      # the clients.
      METASERVE_TRUSTED_PROXIES: "127.0.0.0/8,::1,${METASERVE_SUBNET:-10.217.53.0/28}"
      #
      # Optional: enable immediate refreshes from the release workflow. Configure
      # the same 32+ byte value as the repository secret
      # METASERVE_WEBHOOK_SECRET, and set METASERVE_WEBHOOK_URL there to the
      # public https://.../hooks/github/release endpoint. Never commit the value
      # here.
      # METASERVE_WEBHOOK_SECRET: ${METASERVE_WEBHOOK_SECRET}
      # GITHUB_TOKEN: ghp_... # optional higher polling rate limit

# The project's default network, with its subnet pinned so the trusted-proxy
# range above names it exactly. Changing it on a running deployment recreates the
# network: `docker compose down && docker compose up -d`.
networks:
  default:
    ipam:
      config:
        - subnet: ${METASERVE_SUBNET:-10.217.53.0/28}

volumes:
  meta-cache:
