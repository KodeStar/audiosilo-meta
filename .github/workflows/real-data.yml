name: real-data

# Run the REAL-DATA tests, which nothing else runs.
#
# Every test that reads the real data/ tree skips under -race
# (race_{on,off}_test.go in pkg/check, pkg/canonical, internal/importer and
# internal/repair - the fixture suites cover the concurrent code, and the walks
# cost minutes under the detector), and check.yml's gate is `go test -race
# ./...`. So TestRealDataTree, TestRealDataCanonical, TestData* and
# TestRealTreeDryRunComposesAPlan ran nowhere but a maintainer's machine, and a
# red one sat on main unnoticed for a day - twice. This runs the suite WITHOUT
# the detector, daily, on demand, and on pushes to main that touch Go code.
#
# THE WHOLE SUITE, not a -run pattern: a pattern is a second list of which tests
# are real-data, and the next one added under a name it does not match would be
# silently skipped here too - the exact failure this job exists to end. The
# fixture tests cost about ten seconds beside the real-tree walks (measured
# locally at the default -p on 20 cores: 87.7s for the whole suite against
# 76.5s for the real-data tests alone).
#
# A failed unattended run is as easy to miss as a skipped test, so the report
# job makes it VISIBLE: a failure opens (or comments on) ONE issue labelled
# ci-real-data, naming the run and the failing tests, and the next green run
# closes it. The logic is .github/scripts/real-data-report.sh.
on:
  schedule:
    # Daily, off the hour (scheduled runs queue up at :00) and outside the sync
    # bot's and the release build's busy windows.
    - cron: "17 3 * * *"
  workflow_dispatch:
  # Code merges run it at once rather than up to a day later; never on PRs.
  # The paths mirror check.yml's Go gate (pr-changes.sh's `go` answer: all but
  # data/** bar data/go.mod, and *.md) minus site/**, which no real-data test
  # reads (the two site/*.ts drift guards are not real-data tests and run in
  # check.yml); scripts/realdatapaths_test.go enforces both. Not a required
  # check, so a `paths:` filter is safe. Past 3,000 changed files GitHub can
  # miss a match; the daily run backs that up.
  push:
    branches: [main]
    paths:
      - "**"
      - "!data/**"
      - "data/go.mod"
      - "!**.md"
      - "!site/**"

# Least privilege by default; the report job alone is granted issues: write.
permissions:
  contents: read

# The newest run on main cancels the older one, so the newest commit reports.
# That includes a scheduled or dispatched run a Go push lands on: it tests main's tip too.
concurrency:
  group: real-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Observed 12m05s (2026-10-04, dispatch: ~4m setup, ~8m tests).
    # Observed 9m39s (2026-10-05, scheduled run 37260453061: 3m setup, 6m40s tests).
    # 25 is about twice the slower. The -timeout below is per BINARY, so the
    # worst hang (~4m + ~8m + 10m = ~22m) still panics with its test names and
    # leaves the summary step time to run before the job is killed.
    timeout-minutes: 25
    outputs:
      failures: ${{ steps.summary.outputs.failures }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # .go-version holds the bare MINOR and check-latest resolves it to the
          # newest patch; go.mod's `go` line is a floor, not the toolchain
          # (CLAUDE.md, the `.github/` entry).
          go-version-file: .go-version
          check-latest: true

      - name: Test (no -race, the real tree included)
        id: test
        shell: bash
        # -count=1: the restored build cache carries test results, and a
        # cached pass is no run. -p 2: pkg/check, internal/importer and
        # internal/repair each peak at ~3.5GB loading the tree, so two at a
        # time keeps an OOM kill from posing as a red test - which assumes the
        # 16GB public-repository runner (a private repository's has 7GB).
        # -timeout: see the job's timeout-minutes comment for the margin. No
        # `set -o pipefail`: `shell: bash` already runs `bash -eo pipefail`, so
        # a red go test is a red step through the tee.
        run: |
          go test -count=1 -p 2 -timeout 10m ./... 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Summarize the failures
        id: summary
        if: failure()
        shell: bash
        run: |
          delim="EOF_$(openssl rand -hex 8)"
          {
            echo "failures<<${delim}"
            # Never leave the block unterminated: a failed summary is a line
            # saying so, not a malformed output file that fails this step.
            bash .github/scripts/real-data-report.sh summarize "$RUNNER_TEMP/test.log" \
              || echo "(the failure summary could not be produced; see the run)"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

  report:
    needs: test
    # `!cancelled()`, not `always()`: a superseded or hand-cancelled run files
    # nothing, while a failure, a job timeout and a recovery all report. Only
    # for main: a dispatch from a branch must not touch the issue about main.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Observed 4s on the first run (a handful of API calls).
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          filter: blob:none
          persist-credentials: false

      - name: File, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.test.result }}
          FAILURES: ${{ needs.test.outputs.failures }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: bash .github/scripts/real-data-report.sh report
