name: intake

# Two jobs, both about the bot's own pull requests:
#
#   intake  turns a data issue-form submission into a validated bot pull request
#   rebase  keeps those pull requests mergeable when main moves under them
#
# SECURITY: `intake` runs on the `issues` event, so there is NO fork code
# execution (unlike a fork `pull_request` build) - the only untrusted input is
# the issue body/title and any file the submitter attached. That input is treated
# strictly as DATA: it is written to a file via an environment variable (never
# interpolated into a shell command), parsed by metaissue, and never executed.
# metaissue fetches attachments HTTPS-only from GitHub's user-attachment hosts
# with a size cap. Do not add a step that evals or runs anything derived from the
# issue. `rebase` runs on `push` to main, which is trusted for the same reason
# from the other end: the code it executes is main's - built from main before any
# branch is checked out, never run out of a swept branch's tree - and the only
# branches it rewrites (force-push included) are this repository's own
# bot-intake branches whose change is confined to data/ (see that job).
# The `labeled` trigger is load-bearing: the GitHub API silently DROPS labels on
# issues opened by non-collaborators (the sibling audiosilo-sidecars contributor
# tool creates add-work intake issues over the API; its characters/recaps issues
# now go to KodeStar/audiosilo-meta-community, which runs its own intake), so
# such an issue arrives label-less and the `opened`/`edited` runs skip it. When a
# maintainer later applies the routing label, that fires neither `opened` nor
# `edited` - only `labeled` - so without this trigger the tool's issues could
# never be admitted. The job-level `if` below narrows `labeled` to genuine routing
# labels.
on:
  issues:
    types: [opened, edited, labeled]
  # A merge to main can leave an already-open intake PR conflicting in a pack
  # file, which only a data change can do - but the series-completion bot
  # (GOVERNANCE.md, "Series-completion bot") merges its own pull request ONLY
  # when the head already contains the tip of main, and it carries the
  # bot-intake label so this sweep is what brings it up to date. A docs or
  # tooling merge therefore has to run the sweep too, or the bot's open pull
  # request sits behind main with nothing to rebase it and is recycled after
  # 30 minutes - a whole cycle thrown away. The sweep is cheap when no bot
  # branch is open, so the trigger is every push to main.
  push:
    branches: [main]

# Least privilege at the workflow level is "nothing"; each job takes what it
# needs (issues: write is the intake job's alone - the rebase job never touches
# an issue).
permissions: {}

# Serialize runs per issue, and separately serialize the rebase sweep: two
# sweeps at once would race on the same branches and on --force-with-lease. The
# issue-number expression is empty for a push, so without the conditional both
# would share one accidental "intake-" group.
# Nothing is ever cancelled in flight: creating an issue with both `data` and
# `data:<template>` emits several events at once, and the generic `data` event is
# intentionally skipped by the job-level guard below - with cancel-in-progress it
# would cancel the run that opens the pull request.
#
# That is not the whole of it, because GitHub keeps at most ONE PENDING run per
# group and a newer arrival replaces it, in-progress cancellation or not. So an
# event the job-level `if` will skip - a label that is not a routing label, the
# outcome label the last step applies, an edit to an issue with no `data:` label -
# queued behind a running intake would cancel a REAL run waiting behind it, and
# the submission would sit there with no pull request and no comment. Skipped
# events therefore get their own `-noop` group, ai-verify.yml's pattern. The
# condition below is a VERBATIM copy of the intake job's `if` (its `issues`
# half), so keeping the two in step is a matter of keeping them identical.
concurrency:
  group: >-
    ${{ github.event_name == 'push' && 'intake-rebase' || format('intake-{0}-{1}', github.event.issue.number,
    (
      (
        github.event.action != 'labeled' &&
        contains(join(github.event.issue.labels.*.name), 'data:')
      ) || (
        github.event.action == 'labeled' &&
        startsWith(github.event.label.name, 'data:') &&
        github.event.label.name != 'data:invalid' &&
        github.event.label.name != 'data:needs-human' &&
        github.event.label.name != 'data:duplicate'
      )
    ) && 'run' || 'noop') }}
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    # Observed up to ~23 minutes: a library import loads the whole tree several
    # times (metaissue, the libex fill, metafmt, metacheck). Twice that, so a
    # large import is never cut off mid-write while a hung libex call still is.
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
    # Only act on issues carrying a data-routing label (data:add-work, etc.).
    # For opened/edited we check the issue's current label set; for a `labeled`
    # event we instead gate on the label just added (github.event.label.name), and
    # EXCLUDE the three outcome labels this workflow applies at the end
    # (data:invalid / data:needs-human / data:duplicate). Without that exclusion the
    # workflow's own outcome-labeling (the non-ok step below) would re-fire a
    # `labeled` run - a duplicate intake + duplicate comment - for every non-ok
    # verdict. A genuine routing label (data:add-work, data:add-recording, ...)
    # starts with `data:` but is none of those outcomes. The concurrency group
    # at the top of the file carries a verbatim copy of this condition.
    if: >-
      github.event_name == 'issues' && (
      (
        github.event.action != 'labeled' &&
        contains(join(github.event.issue.labels.*.name), 'data:')
      ) || (
        github.event.action == 'labeled' &&
        startsWith(github.event.label.name, 'data:') &&
        github.event.label.name != 'data:invalid' &&
        github.event.label.name != 'data:needs-human' &&
        github.event.label.name != 'data:duplicate'
      ))
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          # Nothing here runs git against the remote with this token:
          # create-pull-request sets its own credential from its `token` input,
          # and everything else is gh with GH_TOKEN.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # .go-version holds the bare MINOR and check-latest resolves it to the
          # newest patch; go.mod's `go` line is a floor, not the toolchain
          # (CLAUDE.md, the `.github/` entry).
          go-version-file: .go-version
          check-latest: true

      - name: Dump the issue body to a file
        env:
          # Untrusted: written verbatim, never interpolated into a command.
          BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$BODY" > issue-body.md

      - name: Compose records (metaissue)
        id: run
        # The routing template is derived inside metaissue from the issue's
        # labels (issueform.TemplateFromLabels), so the allowlist lives in ONE
        # place. metaissue always emits a JSON verdict - even when no routing
        # label is present it returns status:invalid - so a data:-labeled issue
        # is never processed silently.
        #
        # --profile core is what makes a SIDECAR submission refuse-and-redirect
        # here rather than compose. The two forms left with the layer, but a label
        # can still arrive without one - a maintainer applying data:recaps by hand,
        # a bookmarked prefill URL, the sibling contributor tool - and under the
        # default profile the composer would happily write a works-community entry
        # into a family this repository does not hold. That is a green-looking bot
        # pull request putting CC BY-SA content in the CC0 repo, permanently
        # unmergeable (CI runs --profile core too). With the flag,
        # issueform.templateBelongsElsewhere refuses it as needs-human and the
        # comment names the community repository's issue chooser - the mirror of
        # the message that sends a core form the other way. The rule is DERIVED
        # from each template's writeFamilies, so it cannot drift from what the
        # composer would actually write.
        #
        # --series-lookup reaches the IMPORT template alone. A personal library
        # export names the series a file is tagged with and, on the two intakes
        # that prompted this, no part number on 97 of 123 series rows - every one
        # of them a work left out of its series with a warning. With the flag the
        # row's ASIN is looked up on the live libex service and the position used
        # only when libex names the SAME series. Best-effort and capped: a libex
        # outage leaves the warnings exactly as they are today, so it can never
        # fail an otherwise good submission.
        env:
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          go run ./cmd/metaissue --labels "$LABELS" --body issue-body.md --data data --profile core \
            --series-lookup > result.json || {
            echo '{"status":"invalid","files":[],"messages":["metaissue failed to run"]}' > result.json
          }
          cat result.json
          echo "status=$(jq -r .status result.json)" >> "$GITHUB_OUTPUT"
          echo "template=$(jq -r '.template // ""' result.json)" >> "$GITHUB_OUTPUT"

      # A personal library export states no cover and no chapter list, so an
      # import lands with placeholder covers unless something fills them. This
      # is that something: it looks up the USER-LIBRARY records that carry an
      # ASIN but no cover (or no chapters) and enriches them from the live libex
      # service, through the ordinary --enrich pass - same fill-absent rule,
      # same runtime contradiction guard, same libex-import provenance.
      #
      # Bounded to the user-library tier (the flag's default), which is where the
      # gap is: libex-seeded records already carry covers. The set shrinks as it
      # is filled, and --limit caps a single run either way. Best-effort by
      # design: a libex outage prints warnings and leaves the gaps for next time,
      # and `|| true` keeps it from failing an otherwise good import.
      - name: Fill missing covers and chapters from libex
        if: steps.run.outputs.status == 'ok' && steps.run.outputs.template == 'import'
        run: |
          # The worklist goes to the runner temp, never the repo: this step runs
          # with the import's records already written and uncommitted, so
          # anything left in the tree here would be swept into the PR.
          go run ./cmd/metaimport libex-fill --data data --limit 60 \
            --conflicts "$RUNNER_TEMP/libex-fill-conflicts.ndjson" 2>&1 | tee "$RUNNER_TEMP/libex-fill.log" || true
          # metaimport validates the tree it wrote, so these are belt-and-braces.
          # They FAIL the step rather than reverting: the import's own records are
          # uncommitted in this same tree, so `git checkout -- data/` here would
          # throw away the contribution along with the fill. A broken tree should
          # stop the PR, not silently lose half of it.
          go run ./cmd/metafmt --write --profile core
          go run ./cmd/metacheck --profile core

      - name: Build the pull-request body
        id: prbody
        if: steps.run.outputs.status == 'ok'
        env:
          ISSUE: ${{ github.event.issue.number }}
          SUBMITTER: ${{ github.event.issue.user.login }}
        run: |
          # The license layer is classified by metaissue (issueform.licenseLayer)
          # and carried on the result, so this workflow never re-derives it.
          layer="$(jq -r '.license' result.json)"
          {
            echo "Automated from #${ISSUE} (submitted by @${SUBMITTER})."
            echo
            echo "License layer: **${layer}**."
            echo
            # Files is what the pull request will actually carry - the data/
            # changes in the working tree, read AFTER the libex fill step, which
            # can rewrite packs metaissue never listed - not result.json's files.
            # Capped at 50 (an import can touch hundreds of packs; the full list
            # is the pull request's own Files changed tab). NUL-delimited, as the
            # rebase sweep's conflict listing is: porcelain v1 without -z C-quotes
            # a path holding a quote, a backslash or a control character.
            mapfile -d '' -t files < <(git status -z --porcelain --untracked-files=all -- data/ | cut -z -c4- | sort -z)
            echo "Files:"
            for f in "${files[@]:0:50}"; do echo "- \`${f}\`"; done
            if [ "${#files[@]}" -gt 50 ]; then
              echo "- ... and $(( ${#files[@]} - 50 )) more (see the Files changed tab)"
            fi
            echo
            # .messages arrives BOUNDED (issueform.Result.MarshalJSON): a body
            # stops at 65,536 characters; the full list is .all_messages, in the log.
            mapfile -t msgs < <(jq -r '.messages[]?' result.json)
            if [ "${#msgs[@]}" -gt 0 ]; then
              echo "Notes:"
              for m in "${msgs[@]}"; do echo "- ${m}"; done
              echo
            fi
            echo "Closes #${ISSUE} on merge."
            echo
            echo "> Composed by the intake bot. A maintainer still reviews and approves before merge."
          } > pr-body.md

      - name: Open the pull request
        if: steps.run.outputs.status == 'ok'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # A PR created with the default GITHUB_TOKEN triggers NO pull_request
          # workflows (GitHub's recursion guard), so the required "check" gate
          # never runs and the PR is unmergeable until a human pushes to it or
          # closes/reopens it. INTAKE_PAT is a fine-grained PAT (this repo only,
          # Contents + Pull requests read/write) whose PRs trigger CI normally;
          # the github.token fallback keeps intake working (degraded) if the
          # PAT is missing or expired.
          token: ${{ secrets.INTAKE_PAT || github.token }}
          base: main
          # Only the data tree belongs in an intake PR - without this the action
          # commits the whole working tree, including this job's scratch files
          # (issue-body.md, result.json, pr-body.md).
          add-paths: data/**
          branch: intake/issue-${{ github.event.issue.number }}
          commit-message: "intake: issue #${{ github.event.issue.number }} (${{ steps.run.outputs.template }})"
          title: "[intake] ${{ github.event.issue.title }}"
          body-path: pr-body.md
          labels: |
            data
            bot-intake
          delete-branch: true

      - name: Comment the outcome and label the issue (non-ok)
        if: steps.run.outputs.status != '' && steps.run.outputs.status != 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          STATUS: ${{ steps.run.outputs.status }}
        run: |
          {
            case "$STATUS" in
              duplicate)   echo "This looks like it's **already in the database**." ;;
              needs-human) echo "Thanks! This needs a **maintainer** to finish - it can't be applied mechanically." ;;
              invalid)     echo "This submission couldn't be processed automatically. Please check the details below." ;;
            esac
            echo
            jq -r '.messages[]? | "- " + .' result.json
            echo
            echo "_Posted by the intake bot._"
          } > comment.md
          gh issue comment "$ISSUE" --body-file comment.md
          gh issue edit "$ISSUE" --add-label "data:${STATUS}" || true

  # Keep the bot's own open pull requests mergeable after a merge to main.
  #
  # Records are stored in pack files (PACK-SPEC.md), so two pull requests adding
  # entries in the same slug range touch the same file and the second one
  # conflicts. The resolution is mechanical - three-way merge the entries,
  # re-render canonically - and it is scripted so a maintainer never hand-merges a
  # bot pull request. scripts/pack-union-merge.sh owns the rules (and the cases it
  # refuses); scripts/packmerge_test.go drives it through real rebases, so this
  # workflow is only the sweep around it.
  #
  # Every failure is contained to ONE pull request: the branch is restored, the
  # working tree cleaned, a comment posted, and the sweep moves on. A transport
  # failure (a lost --force-with-lease race, a branch deleted mid-sweep) must not
  # take the remaining pull requests down with it.
  #
  # SECURITY: this job runs on `push` to main with a WRITE token persisted in
  # .git/config (the force-push needs it), and it checks each swept branch out -
  # so nothing it EXECUTES may come from that branch. A branch is selected by
  # the bot-intake LABEL, which is data rather than proof of who wrote the
  # branch, and a checked-out tree's `go run ./cmd/...` or `scripts/...` is that
  # branch's code, not main's. So the tools the loop runs - metafmt, metacheck
  # and the packjson merge driver - are built and copied from MAIN into the
  # runner temp before the first branch is touched, and a branch is swept at all
  # only when it is a same-repository branch whose whole diff against main is
  # under data/ (both skips are log lines, not comments: they recur on every
  # push to main). Everything left that reads the branch reads it as data.
  rebase:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Observed up to ~9 minutes; the loop's cost scales with the number of open
    # bot pull requests (a metafmt + metacheck pass over the whole tree for
    # each one the pack driver touched), so the headroom is generous. A hung
    # sweep holds the intake-rebase group, which is what the bound is for.
    timeout-minutes: 45
    # Narrower than the intake job's: no issues: write, because nothing here
    # touches an issue.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The rebase needs real history, and the PAT (when present) is what
          # makes the force-push re-trigger the required checks - the same
          # reasoning as the create-pull-request step above. The credential
          # stays PERSISTED here, unlike every other checkout in this
          # repository: the sweep pushes with plain git. That is why the header
          # above keeps branch code out of this job's process tree.
          fetch-depth: 0
          token: ${{ secrets.INTAKE_PAT || github.token }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # .go-version holds the bare MINOR and check-latest resolves it to the
          # newest patch; go.mod's `go` line is a floor, not the toolchain
          # (CLAUDE.md, the `.github/` entry).
          go-version-file: .go-version
          check-latest: true

      - name: Rebase open intake pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        # jq is preinstalled on ubuntu-latest and is what pack-union-merge.sh
        # merges with; a runner image without it would fail the merge step and
        # leave every conflicted pull request for a human, which is the safe way
        # round.
        run: |
          set -uo pipefail
          git config user.name "audiosilo-intake-bot"
          git config user.email "intake-bot@users.noreply.github.com"

          # A fork's branch is not in this repository to rebase or push, and its
          # content is nobody's this workflow can vouch for: logged, never swept.
          #
          # --limit: gh lists 30 by default, and a pull request past the 30th was
          # silently never swept. LEAST RECENTLY UPDATED first: a swept branch's
          # force-push bumps its updatedAt, so a sweep the job timeout cuts short
          # leaves the unswept ones at the FRONT of the next sweep instead of
          # starving the same tail on every push to main.
          gh pr list --state open --label bot-intake --limit 500 \
            --json number,headRefName,isCrossRepository,updatedAt > prs.json
          jq -r '.[] | select(.isCrossRepository) | "::warning::PR #\(.number) is from a fork; the sweep only rebases branches in this repository. Skipped."' prs.json
          jq -r 'sort_by(.updatedAt) | .[] | select(.isCrossRepository | not) | [.number, .headRefName] | @tsv' prs.json > prs.tsv
          if [ ! -s prs.tsv ]; then
            echo "no open intake pull requests"
            exit 0
          fi

          # MAIN's tools, built while main is still the checkout (see the job's
          # SECURITY note): every metafmt/metacheck call and the merge driver
          # below run these copies, never whatever a swept branch's tree holds.
          # Built only now, after the no-pull-requests exit, because the common
          # sweep has nothing to do. A failed build fails the whole sweep (by
          # hand: this step runs without -e), which is right - without trusted
          # tools there is nothing it may run.
          tools="${RUNNER_TEMP}/intake-sweep-tools"
          if ! mkdir -p "$tools" \
              || ! go build -o "$tools/" ./cmd/metafmt ./cmd/metacheck \
              || ! install -m 0755 scripts/pack-union-merge.sh "$tools/pack-union-merge.sh"; then
            echo "::error::could not build the sweep's tools from main; no branch was touched"
            exit 1
          fi

          # .gitattributes routes data/**/*.json to this driver; a driver only
          # runs where it is configured, so this line is what turns it on for the
          # sweep. It matters because git's LINE merge is unsound for a pack file:
          # two branches adding the SAME entry key can have their insertions
          # anchored at different lines, and git then writes the key TWICE - a
          # file pkg/pack refuses and metafmt cannot re-render (issue #1695). The
          # driver merges the entry maps before any of that can happen, and
          # refuses exactly what the recipe below refuses. It names main's copy by
          # absolute path: git runs a driver from the working tree's root, so a
          # relative path would resolve to the replayed branch's script.
          git config merge.packjson.name "three-way merge of pack-file entries"
          git config merge.packjson.driver "'$tools/pack-union-merge.sh' %O %A %B %P"

          # restore returns the checkout to a clean copy of main. `git clean` is
          # not optional: metafmt --write can CREATE pack files before metacheck
          # rejects the tree, and an untracked file left behind would be
          # committed onto the next pull request in the sweep.
          restore() {
            git rebase --abort 2>/dev/null || true
            git checkout --quiet --force main 2>/dev/null || true
            git clean -fdq data 2>/dev/null || true
          }

          # refuse leaves a pull request the sweep will not touch, and says why
          # ONCE: the same verdict recurs on every push to main, so the comment
          # carries a fixed marker and is not posted again while one bearing it
          # exists. A comment listing that fails is not read as "none yet" -
          # that way round would comment on every push.
          refused_marker="<!-- intake-sweep:not-rebased -->"
          refuse() {
            echo "::warning::PR #$1 is not rebased by the sweep: $2"
            local bodies
            if ! bodies="$(gh pr view "$1" --json comments --jq '.comments[].body')"; then
              echo "::warning::could not read the comments on PR #$1; not commenting"
              return
            fi
            if printf '%s\n' "$bodies" | grep -qF "$refused_marker"; then
              return
            fi
            gh pr comment "$1" --body "${refused_marker}
          The intake bot does not rebase this pull request onto \`main\`: $2. Its sweep checks a branch out beside a write token, so it only takes branches whose whole change is ordinary files under \`data/\`. A maintainer has to rebase this one (or split the non-data change out). This note is posted once." \
              || echo "::warning::could not comment on PR #$1"
          }

          swept=0
          while IFS=$'\t' read -r number branch; do
            echo "::group::PR #${number} (${branch})"
            failure=""

            if ! git fetch --quiet origin main "$branch"; then
              failure="the branch could not be fetched (deleted, or renamed?)"
            elif ! outside="$(git diff --no-renames --name-only "origin/main...origin/${branch}" -- ':(exclude)data/')"; then
              # Unclassifiable is not sweepable: the rule below cannot be asked.
              failure="the branch's changed files could not be listed"
            elif ! links="$(git log --no-renames --raw --format= "origin/main..origin/${branch}" \
                | awk -F'\t' '{ split($1, mode, " "); if (mode[2] == "120000") print $2 }')"; then
              failure="the branch's commits could not be listed"
            elif [ -n "$links" ]; then
              # A SYMBOLIC LINK added or retargeted by ANY of the branch's
              # commits (--raw's second mode column is the new mode; every
              # commit, since a conflict can stop the replay at one where a
              # later commit's removal has not happened yet). metafmt --write
              # reads and rewrites files through a link, so one under data/
              # pointing at .git/config or a workflow would be followed out of
              # the tree with the token persisted.
              refuse "$number" "it adds or changes a symbolic link ($(printf '%s' "$links" | head -n 5 | tr '\n' ' '))"
              echo "::endgroup::"
              continue
            elif [ -n "$outside" ]; then
              # The pull request's own change (three-dot: against the merge
              # base) reaches beyond data/, so rebasing it would put this job's
              # write token beside a checkout of code nobody here reviewed.
              # --no-renames: a rename INTO data/ would otherwise list only its
              # destination and hide the path it removed.
              refuse "$number" "it changes files outside data/ ($(printf '%s' "$outside" | head -n 5 | tr '\n' ' '))"
              echo "::endgroup::"
              continue
            elif git merge-base --is-ancestor origin/main "origin/${branch}"; then
              echo "already on top of main"
              echo "::endgroup::"
              continue
            elif ! git checkout --quiet -B "$branch" "origin/${branch}"; then
              failure="the branch could not be checked out"
            else
              # The rebase output is kept because a CLEAN rebase can still have
              # merged two branches' entries: the driver resolves a pack conflict
              # inside the replay, and says so on the line grepped for below.
              rebaselog="${RUNNER_TEMP:-/tmp}/rebase-${number}.log"
              if git rebase origin/main > "$rebaselog" 2>&1; then
                cat "$rebaselog"
                if grep -q "merged both sides" "$rebaselog"; then
                  # A driver merge lands as jq's rendering of the entry map, and
                  # the merged pack may now be due a split, so normalize before
                  # pushing - the same pass the conflicted path runs below.
                  if ! "$tools/metafmt" --write --profile core; then
                    failure="metafmt could not normalize the merged tree"
                  elif ! "$tools/metacheck" --profile core; then
                    failure="metacheck rejected the merged tree"
                  else
                    git add data
                    if ! git diff --cached --quiet; then
                      GIT_EDITOR=true git commit --amend --no-edit --quiet \
                        || failure="the normalized merge could not be committed"
                    fi
                  fi
                fi
              else
                cat "$rebaselog"
                # Three-way merge every conflicted pack file, then let metafmt place
                # and re-render the result. Anything else - a conflict outside
                # data/, or one record edited on both sides - is for a person.
                # NUL-delimited and read into an array rather than word-split:
                # a path with a space in it used to arrive as two "files", both
                # unmatched by data/*.json, and the *) arm then reported a
                # conflict outside the data tree that was never there. mapfile,
                # not a `while read` pipeline - the loop assigns `failure`, and a
                # pipeline's subshell would throw that away, turning the
                # fail-safe arm into a silent pass.
                mapfile -d '' -t conflicted < <(git diff -z --name-only --diff-filter=U)
                for f in "${conflicted[@]}"; do
                  case "$f" in
                    data/*.json) "$tools/pack-union-merge.sh" "$f" || failure="the pack merge could not resolve ${f}" ;;
                    *) failure="conflict outside the data tree: ${f}" ;;
                  esac
                  [ -z "$failure" ] || break
                done
                if [ -z "$failure" ] && ! "$tools/metafmt" --write --profile core; then
                  failure="metafmt could not normalize the merged tree"
                fi
                if [ -z "$failure" ] && ! "$tools/metacheck" --profile core; then
                  failure="metacheck rejected the merged tree"
                fi
                if [ -z "$failure" ]; then
                  git add data
                  GIT_EDITOR=true git rebase --continue || failure="the rebase could not be continued"
                fi
              fi
            fi

            if [ -z "$failure" ] && ! git push --force-with-lease origin "$branch"; then
              # A lost lease means someone else moved the branch while we worked;
              # the next push to main sweeps it again.
              failure="the branch moved while it was being rebased"
            fi

            restore
            if [ -n "$failure" ]; then
              gh pr comment "$number" --body "The intake bot could not rebase this branch onto \`main\` mechanically: ${failure}. It needs a maintainer - see CONTRIBUTING.md, \"When two pull requests touch the same pack\"." \
                || echo "::warning::could not comment on PR #${number}"
              echo "::warning::PR #${number} needs a human: ${failure}"
            else
              echo "rebased and pushed"
              swept=$((swept + 1))
            fi
            echo "::endgroup::"
          done < prs.tsv
          echo "rebased ${swept} pull request(s)"
