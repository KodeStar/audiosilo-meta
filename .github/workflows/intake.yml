name: intake

# Turn a data issue-form submission into a validated bot pull request.
#
# SECURITY: this runs on the `issues` event, so there is NO fork code execution
# (unlike a fork `pull_request` build) - the only untrusted input is the issue
# body/title and any file the submitter attached. That input is treated strictly
# as DATA: it is written to a file via an environment variable (never
# interpolated into a shell command), parsed by metaissue, and never executed.
# metaissue fetches attachments HTTPS-only from GitHub's user-attachment hosts
# with a size cap. Do not add a step that evals or runs anything derived from the
# issue.
# The `labeled` trigger is load-bearing: the GitHub API silently DROPS labels on
# issues opened by non-collaborators (the sibling audiosilo-sidecars contributor
# tool creates add-work/add-characters/add-recaps intake issues over the API), so
# such an issue arrives label-less and the `opened`/`edited` runs skip it. When a
# maintainer later applies the routing label, that fires neither `opened` nor
# `edited` - only `labeled` - so without this trigger the tool's issues could
# never be admitted. The job-level `if` below narrows `labeled` to genuine routing
# labels.
on:
  issues:
    types: [opened, edited, labeled]
  # A merge to main can leave an already-open intake PR conflicting in a pack
  # file, so the rebase job below re-bases the bot's OWN branches. It runs on
  # push, which is a trusted event: the code it runs is main's, and the branches
  # it touches were created by this workflow.
  push:
    branches: [main]

# Least privilege: open a PR, comment on the issue, and label it. Nothing more.
permissions:
  contents: write
  pull-requests: write
  issues: write

# Serialize runs for one issue, but never let a later ineligible label event cancel
# an eligible opened/edited/routing-label run. Creating an issue with both `data`
# and `data:<template>` emits several events at once; the generic `data` event is
# intentionally skipped by the job-level guard below and used to cancel the run
# that would have opened the PR when cancel-in-progress was enabled.
concurrency:
  group: intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    # Only act on issues carrying a data-routing label (data:add-work, etc.).
    # For opened/edited we check the issue's current label set; for a `labeled`
    # event we instead gate on the label just added (github.event.label.name), and
    # EXCLUDE the three outcome labels this workflow applies at the end
    # (data:invalid / data:needs-human / data:duplicate). Without that exclusion the
    # workflow's own outcome-labeling (the non-ok step below) would re-fire a
    # `labeled` run - a duplicate intake + duplicate comment - for every non-ok
    # verdict. A genuine routing label (data:add-work, data:add-characters, ...)
    # starts with `data:` but is none of those outcomes.
    if: >-
      github.event_name == 'issues' && (
      (
        github.event.action != 'labeled' &&
        contains(join(github.event.issue.labels.*.name), 'data:')
      ) || (
        github.event.action == 'labeled' &&
        startsWith(github.event.label.name, 'data:') &&
        github.event.label.name != 'data:invalid' &&
        github.event.label.name != 'data:needs-human' &&
        github.event.label.name != 'data:duplicate'
      ))
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Dump the issue body to a file
        env:
          # Untrusted: written verbatim, never interpolated into a command.
          BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$BODY" > issue-body.md

      - name: Compose records (metaissue)
        id: run
        # The routing template is derived inside metaissue from the issue's
        # labels (issueform.TemplateFromLabels), so the allowlist lives in ONE
        # place. metaissue always emits a JSON verdict - even when no routing
        # label is present it returns status:invalid - so a data:-labeled issue
        # is never processed silently.
        env:
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          go run ./cmd/metaissue --labels "$LABELS" --body issue-body.md --data data > result.json || {
            echo '{"status":"invalid","files":[],"messages":["metaissue failed to run"]}' > result.json
          }
          cat result.json
          echo "status=$(jq -r .status result.json)" >> "$GITHUB_OUTPUT"
          echo "template=$(jq -r '.template // ""' result.json)" >> "$GITHUB_OUTPUT"

      - name: Build the pull-request body
        id: prbody
        if: steps.run.outputs.status == 'ok'
        env:
          ISSUE: ${{ github.event.issue.number }}
          SUBMITTER: ${{ github.event.issue.user.login }}
        run: |
          # The license layer is classified by metaissue (issueform.licenseLayer)
          # and carried on the result, so this workflow never re-derives it.
          layer="$(jq -r '.license' result.json)"
          {
            echo "Automated from #${ISSUE} (submitted by @${SUBMITTER})."
            echo
            echo "License layer: **${layer}**."
            echo
            echo "Files:"
            # .files[]? tolerates an absent/null files field (metaissue emits []
            # so this is belt-and-braces); the import path reports no file list.
            jq -r '.files[]? | "- `" + . + "`"' result.json
            echo
            mapfile -t msgs < <(jq -r '.messages[]?' result.json)
            if [ "${#msgs[@]}" -gt 0 ]; then
              echo "Notes:"
              for m in "${msgs[@]}"; do echo "- ${m}"; done
              echo
            fi
            echo "Closes #${ISSUE} on merge."
            echo
            echo "> Composed by the intake bot. A maintainer still reviews and approves before merge."
          } > pr-body.md

      - name: Open the pull request
        if: steps.run.outputs.status == 'ok'
        uses: peter-evans/create-pull-request@v6
        with:
          # A PR created with the default GITHUB_TOKEN triggers NO pull_request
          # workflows (GitHub's recursion guard), so the required "check" gate
          # never runs and the PR is unmergeable until a human pushes to it or
          # closes/reopens it. INTAKE_PAT is a fine-grained PAT (this repo only,
          # Contents + Pull requests read/write) whose PRs trigger CI normally;
          # the github.token fallback keeps intake working (degraded) if the
          # PAT is missing or expired.
          token: ${{ secrets.INTAKE_PAT || github.token }}
          base: main
          # Only the data tree belongs in an intake PR - without this the action
          # commits the whole working tree, including this job's scratch files
          # (issue-body.md, result.json, pr-body.md).
          add-paths: data/**
          branch: intake/issue-${{ github.event.issue.number }}
          commit-message: "intake: issue #${{ github.event.issue.number }} (${{ steps.run.outputs.template }})"
          title: "[intake] ${{ github.event.issue.title }}"
          body-path: pr-body.md
          labels: |
            data
            bot-intake
          delete-branch: true

      - name: Comment the outcome and label the issue (non-ok)
        if: steps.run.outputs.status != '' && steps.run.outputs.status != 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          STATUS: ${{ steps.run.outputs.status }}
        run: |
          {
            case "$STATUS" in
              duplicate)   echo "This looks like it's **already in the database**." ;;
              needs-human) echo "Thanks! This needs a **maintainer** to finish - it can't be applied mechanically." ;;
              invalid)     echo "This submission couldn't be processed automatically. Please check the details below." ;;
            esac
            echo
            jq -r '.messages[]? | "- " + .' result.json
            echo
            echo "_Posted by the intake bot._"
          } > comment.md
          gh issue comment "$ISSUE" --body-file comment.md
          gh issue edit "$ISSUE" --add-label "data:${STATUS}" || true

  # Keep the bot's own open pull requests mergeable after a merge to main.
  #
  # Records are stored in pack files (PACK-SPEC.md), so two PRs adding entries in
  # the same slug range touch the same file and the second one conflicts. The
  # resolution is mechanical - keep both sides' entries and re-render canonically
  # - and it is scripted here so a maintainer never hand-merges a bot PR. Only
  # the same entry key changing on both sides is a real conflict, and that is
  # left for a human with a comment.
  #
  # SECURITY: this job runs on `push` to main, so the code it executes is main's
  # and the branches it rewrites are ones this workflow created (label
  # bot-intake). It never checks out or runs anything from a fork.
  rebase:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The rebase needs real history, and the PAT (when present) is what
          # makes the force-push re-trigger the required checks - the same
          # reasoning as the create-pull-request step above.
          fetch-depth: 0
          token: ${{ secrets.INTAKE_PAT || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Rebase open intake pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "audiosilo-intake-bot"
          git config user.email "intake-bot@users.noreply.github.com"

          gh pr list --state open --label bot-intake --json number,headRefName \
            --jq '.[] | [.number, .headRefName] | @tsv' > prs.tsv
          if [ ! -s prs.tsv ]; then
            echo "no open intake pull requests"
            exit 0
          fi

          while IFS=$'\t' read -r number branch; do
            echo "::group::PR #${number} (${branch})"
            git fetch --quiet origin main "$branch"
            if git merge-base --is-ancestor origin/main "origin/${branch}"; then
              echo "already on top of main"
              git rebase --abort 2>/dev/null || true
              echo "::endgroup::"
              continue
            fi
            git checkout --quiet -B "$branch" "origin/${branch}"

            failure=""
            if ! git rebase origin/main; then
              # Union every conflicted pack file, then let metafmt place and
              # re-render the result. Anything else - a conflict outside data/,
              # or one entry key edited on both sides - stops the run.
              conflicts="$(git diff --name-only --diff-filter=U)"
              for f in $conflicts; do
                case "$f" in
                  data/*.json) scripts/pack-union-merge.sh "$f" || failure="union merge failed on ${f}" ;;
                  *) failure="conflict outside the data tree: ${f}" ;;
                esac
                [ -z "$failure" ] || break
              done
              if [ -z "$failure" ]; then
                go run ./cmd/metafmt --write || failure="metafmt could not normalize the merged tree"
              fi
              if [ -z "$failure" ]; then
                go run ./cmd/metacheck || failure="metacheck rejected the merged tree"
              fi
              if [ -z "$failure" ]; then
                git add data
                GIT_EDITOR=true git rebase --continue || failure="the rebase could not be continued"
              fi
            fi

            if [ -n "$failure" ]; then
              git rebase --abort 2>/dev/null || true
              git checkout --quiet --force main
              gh pr comment "$number" --body "The intake bot could not rebase this branch onto \`main\` mechanically: ${failure}. It needs a maintainer - see CONTRIBUTING.md, \"When two pull requests touch the same pack\"."
              echo "::warning::PR #${number} needs a human: ${failure}"
              echo "::endgroup::"
              continue
            fi

            git push --force-with-lease origin "$branch"
            echo "rebased and pushed"
            git checkout --quiet --force main
            echo "::endgroup::"
          done < prs.tsv
