name: check

# Validate every pull request and every push to main.
#
# SECURITY: this uses the plain `pull_request` trigger, NOT
# `pull_request_target`, so fork pull requests run with a read-only token and no
# access to secrets. Do not switch to `pull_request_target` (the "pwn request"
# supply-chain pattern) - any privileged follow-up must live in a separate
# workflow that consumes only artifacts.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: read the code, nothing more. No secrets are needed to validate.
permissions:
  contents: read

# One live validation per pull request. The intake sweep force-pushes every open
# bot-intake pull request on each data merge to main, and without a group each
# force-push stacked a fresh full run behind the last - one merge queued a run
# per open intake PR, and a string of merges multiplied that by the number of
# merges. A superseded head's run validates a tree that can no longer be merged,
# so it is cancelled. Pushes to main are never grouped or cancelled (the sha
# group is unique per push): every commit that lands on main gets its own
# complete validation.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # WHICH JOBS THE DIFF CAN MOVE, decided once for all of them.
  #
  # Most pull requests here are the intake and sync bots', and a tranche of pack
  # files cannot change what `go vet` or the race detector say - so the Go gate
  # (build/vet/test/lint/vuln) is skipped for a diff that is only data and prose,
  # and the compose job keeps the narrower probe it always had. metacheck and
  # metafmt are NOT gated: they are the data's own check.
  #
  # The rules, the fail-open and why this is an output rather than a `paths:`
  # filter are all in .github/scripts/pr-changes.sh. The checkout is blobless and
  # sparse because the script is the only file this job needs and the data tree
  # is gigabytes.
  changes:
    runs-on: ubuntu-latest
    # A single API listing; observed well under a minute.
    timeout-minutes: 5
    outputs:
      go: ${{ steps.classify.outputs.go }}
      compose: ${{ steps.classify.outputs.compose }}
    steps:
      - name: Checkout the scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          filter: blob:none
          # No job in this workflow talks to a remote after its checkout (this
          # one reads the diff through gh, not git), so none keeps the token in
          # .git/config - and every one of them runs a pull request's code, a
          # fork's included.
          persist-credentials: false

      - name: Classify the diff
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/pr-changes.sh

  check:
    runs-on: ubuntu-latest
    needs: changes
    # Observed up to ~18 minutes with the Go gate (the -race suite plus a
    # whole-tree metacheck and metafmt), and the tree only grows. About twice
    # that: a hang is caught inside the hour instead of at GitHub's six.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # go.mod's `go 1.25.0` is an exact patch, and `go mod tidy` will not
          # keep a bare minor there, so the minor is repeated here - bump it
          # with go.mod's directive.
          go-version: "1.25"
          # go.mod's version is a FLOOR, not the toolchain (CLAUDE.md, "Build / test / gate").
          check-latest: true

      # Go steps only: a data-and-prose diff skips them (see the changes job).
      # Set up Go above is unconditional - metacheck and metafmt are `go run`.
      - name: Build
        if: needs.changes.outputs.go == 'true'
        run: go build ./...

      - name: Vet
        if: needs.changes.outputs.go == 'true'
        run: go vet ./...

      - name: Test
        if: needs.changes.outputs.go == 'true'
        # -race, as the documented gate is. pkg/check's real-data test skips
        # under the detector (race_{on,off}_test.go) - the fixture suites cover
        # the parallel loader and the real tree is data coverage, validated by
        # metacheck below - so the suite stays inside a few minutes.
        run: go test -race ./...

      # --profile core is what this repository's data root now IS: works, people,
      # series and redirects.json, with the CC BY-SA layer living in
      # KodeStar/audiosilo-meta-community. It is passed explicitly rather than
      # changed as a flag default, because the tools still serve a whole-database
      # tree ("all") and a community-only one. The teeth are the file accounting:
      # under `core` a works-community/ directory that reappears here - a bad
      # merge, a stray revert, a misdirected contribution - is an unrecognized
      # location and a RED check, instead of a family silently re-adopted.
      - name: Validate data (metacheck)
        run: go run ./cmd/metacheck --profile core

      - name: Check canonical formatting (metafmt)
        run: go run ./cmd/metafmt --check --profile core

  # The other half of the documented gate (CLAUDE.md): `golangci-lint run`.
  # It was documented and run by hand but never by CI, so the green baseline the
  # guide promises rested on somebody remembering. Its own job because linting
  # and testing are independent and parallel jobs finish sooner. The linter
  # version is pinned rather than `latest`: a new release adds checks, and a
  # baseline that goes red on a day nobody changed Go code is a broken gate.
  lint:
    runs-on: ubuntu-latest
    needs: changes
    # Observed up to ~5 minutes.
    timeout-minutes: 15
    # Every step is gated, so a data-and-prose diff reports this job green
    # without checking anything out - the required check still reports.
    steps:
      - name: Checkout
        if: needs.changes.outputs.go == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        if: needs.changes.outputs.go == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # go.mod's `go 1.25.0` is an exact patch, and `go mod tidy` will not
          # keep a bare minor there, so the minor is repeated here - bump it
          # with go.mod's directive.
          go-version: "1.25"
          # go.mod's version is a FLOOR, not the toolchain (CLAUDE.md, "Build / test / gate").
          check-latest: true

      - name: golangci-lint
        if: needs.changes.outputs.go == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12

  # Known-vulnerability scan over the module and the toolchain it builds with.
  #
  # STRICT on purpose - a reachable advisory is a red check, not a note.
  vuln:
    runs-on: ubuntu-latest
    needs: changes
    # Observed up to ~5 minutes.
    timeout-minutes: 15
    steps:
      - name: Checkout
        if: needs.changes.outputs.go == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        if: needs.changes.outputs.go == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # go.mod's `go 1.25.0` is an exact patch, and `go mod tidy` will not
          # keep a bare minor there, so the minor is repeated here - bump it
          # with go.mod's directive.
          go-version: "1.25"
          # go.mod's version is a FLOOR, not the toolchain (CLAUDE.md, "Build / test / gate").
          check-latest: true

      - name: govulncheck
        if: needs.changes.outputs.go == 'true'
        # golang/govulncheck-action installs golang.org/x/vuln/cmd/govulncheck@latest,
        # and that command now requires Go >= 1.26 (x/vuln v1.8.0 declares
        # `go 1.26`) while this repo builds on 1.25 - so the tool is run
        # directly here instead of through the action, pinned to v1.7.0 (the
        # newest release that still declares `go 1.25.0`). Dependabot's gomod
        # ecosystem does not see a version inside a `go run` argument, so
        # bumping this pin - together with the Go minor above - is a human's
        # job, done when go.mod's directive moves.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  # The CROSS-TREE half of validation, which no single-root check can perform.
  #
  # `metacheck --profile core` above judges this repository's tree alone. The
  # rules that span the two repositories - a community sidecar keyed by a work
  # this core does not hold, a key riding a redirect, two sidecars of one kind
  # resolving onto one work - can only be asked where BOTH trees are present, and
  # until now that was only the release build. So a core PR that retired or
  # deleted a sidecar-keyed work went green here and broke the RELEASE STREAM
  # after merge, for everyone, with the fix needing a second PR.
  #
  # This job is the pre-merge half of that same build: the exact composition
  # release.yml performs, run at PR time, failing on a non-zero exit. It should be
  # REQUIRED, not advisory - its whole point is to be the thing that stops the
  # merge.
  #
  # The community checkout is public and read-only (github.token, no secret), and
  # the artifact goes to the runner temp: nothing is published and nothing is
  # cached. It floats on the community repo's `main` deliberately - that is what
  # the release will compose against, so a core change that breaks the pair should
  # go red the moment either side makes it true.
  # PULL REQUESTS ONLY: on push to main the identical compose runs minutes later
  # as the release build itself, which is the authoritative gate - composing here
  # too would build every data merge twice for no extra signal. And within a PR
  # it SELF-SKIPS (the site job's required-check-compatible pattern) unless the
  # diff touches something that can change the compose's answer: the same path
  # set release.yml releases on, plus this workflow itself. That question is the
  # changes job's `compose` output now, decided from the same listing the Go
  # gate's is - and, unlike the inline probe it replaces, failing OPEN.
  compose:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request'
    # Observed up to ~8 minutes: two checkouts and a full compose of the
    # 1.7 GB artifact, which grows with the catalogue.
    timeout-minutes: 20
    steps:
      - name: Checkout
        if: needs.changes.outputs.compose == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Checkout the community layer
        if: needs.changes.outputs.compose == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: KodeStar/audiosilo-meta-community
          ref: main
          path: community
          persist-credentials: false

      - name: Set up Go
        if: needs.changes.outputs.compose == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # go.mod's `go 1.25.0` is an exact patch, and `go mod tidy` will not
          # keep a bare minor there, so the minor is repeated here - bump it
          # with go.mod's directive.
          go-version: "1.25"
          # go.mod's version is a FLOOR, not the toolchain (CLAUDE.md, "Build / test / gate").
          check-latest: true

      - name: Compose both trees (metabuild --community)
        if: needs.changes.outputs.compose == 'true'
        # Building rather than only checking is deliberate: the compose rules run
        # inside the loader metabuild drives (check.LoadComposed), so this IS the
        # check, and going all the way to an artifact additionally exercises the
        # builder over the composed catalogue - the same work release.yml does, so
        # a green run here means the release can be cut.
        run: go run ./cmd/metabuild -data data --community community/data -o "$RUNNER_TEMP/meta.sqlite"

  # Build and typecheck the marketing/search site. This job is intentionally
  # unconditional (branch protection can require it), but it self-skips cleanly
  # when site/ is absent, so it stays green before the site lands and gates it
  # once it does. No `paths:` filter - a required check must always report.
  site:
    runs-on: ubuntu-latest
    # Observed up to ~6 minutes (a cold yarn install dominates).
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check for site/
        id: site
        run: |
          if [ -f site/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "site/ not present yet; skipping."
          fi

      - name: Set up Node
        if: steps.site.outputs.exists == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install, build, typecheck, and test the site
        if: steps.site.outputs.exists == 'true'
        working-directory: site
        run: |
          yarn install --frozen-lockfile
          yarn build
          yarn run check
          yarn test
