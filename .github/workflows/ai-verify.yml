name: ai-verify

# Advisory AI review of a data pull request's RECORDS. This is a judgement layer
# on top of the mechanical `check` workflow (schema/integrity/formatting), never
# a replacement for it: it posts a PASS/FLAG comment and label. Neither verdict
# blocks a merge - this check is not branch protected. The job's COLOUR is a
# separate signal: red means no verdict was reached (see the script's EXIT
# STATUS block).
#
# WHAT THE MODEL READS is an entry-level summary produced by `cmd/metadiff`, not
# the pull request's text diff - see the "Gather the data change" step, which
# states why.
#
# SECURITY: this uses the plain `pull_request` trigger, NOT
# `pull_request_target`, which is FORBIDDEN in this repo (the "pwn request"
# supply-chain pattern). Consequences, accepted deliberately:
#   - Fork pull requests run with a read-only token and NO secrets, so neither
#     CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is present there. The job
#     therefore does not run on a fork PR at all (see the `if:` below): a fork
#     run could only ever reach the script's skip, which is now a RED check (see
#     the script's EXIT STATUS note), and a permanently-red check nobody can fix
#     teaches people to ignore the colour. A fork PR is AI-verified after a
#     maintainer pushes its branch to this repository (a same-repo branch gets
#     the secret and a write token) or re-runs it via workflow_dispatch, which
#     runs from the default branch WITH the secret. We do NOT weaken this to
#     reach fork secrets.
#   - The summary is built from contributor-supplied data and is passed to the
#     model as untrusted DATA, never executed (see .github/scripts/ai-verify.sh).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "data/**"
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to verify"
        required: true
        # GitHub validates a `number` input at dispatch time, so the UI and the
        # API both refuse a non-numeric one before the job starts. The shell
        # guard below stays: the REST dispatch path is not guaranteed to type
        # check, and the input reaches gh, git and a step output.
        type: number

permissions:
  contents: read
  pull-requests: write

# A `labeled` event for anything but the opt-in `ai-verify` label is a no-op
# run (the job-level `if` below skips it), but sharing the real runs' group it
# still CANCELLED a genuine in-flight verify via cancel-in-progress: the intake
# bot applies its routing labels (data, bot-intake) right after opening, so the
# `opened` run died and the PR ended with a skipped verify and no verdict
# (observed on 26 of 30 open intake PRs, three runs created in the same
# second). No-op runs therefore get their own `-noop` group; only real runs
# supersede each other.
#
# A FORK pull request is the SECOND class of no-op run, and it exists because
# the job-level `if` below stopped admitting forks at all. Its `opened` and
# `synchronize` events are not `labeled`, so the original selector called them
# real and put them in the `-run` group - where a push to the fork PR would
# cancel the workflow_dispatch a maintainer had started for it, which is now the
# only route by which a fork PR gets verified. That is the same defect the
# paragraph above describes, reached from the other side, so the fork case joins
# the same `-noop` group rather than getting a mechanism of its own.
concurrency:
  group: ai-verify-${{ github.event.pull_request.number || github.event.inputs.pr }}-${{ ((github.event.action == 'labeled' && github.event.label.name != 'ai-verify') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'noop' || 'run' }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # HAS_OAUTH gates the CLI-install step below. A step-level `if:` can read the
    # `env` context but a `secrets` comparison there is fragile, so we resolve
    # the presence of the OAuth secret into a plain boolean env var here (job
    # `env` may reference `secrets`). Empty on fork PRs (no secrets).
    env:
      HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    # Same-repo branches (secrets + write token available) or a manual dispatch.
    # A fork PR is not run at all: it cannot reach the secret, so the ONLY thing
    # it could produce is the script's skip, and a skip is now a red check. The
    # `ai-verify` label used to opt a fork PR in here; it bought a run that could
    # not verify anything, which under the new exit rule is a red check no
    # contributor can clear. Dropping that arm is what makes "red means no
    # verdict" exception-free. The label still re-triggers a SAME-REPO PR through
    # the `labeled` narrowing below.
    #
    # A `labeled` event is narrowed to the opt-in `ai-verify` label and EXCLUDES
    # the two outcome labels this workflow applies at the end (ai-verified /
    # ai-flagged). Without that exclusion the labeling step below re-fires a
    # `labeled` run for every PR it just verified: a second, wasted model call
    # whose only effect is to cancel the in-flight run through the concurrency
    # group above, leaving a cancelled `verify` check on a PR that was in fact
    # verified. That accounted for 36 of 60 consecutive runs. `intake.yml` guards
    # its own outcome labels the same way.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        (
          github.event.action != 'labeled' ||
          github.event.label.name == 'ai-verify'
        ) &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # metadiff is a Go command in this repository, so the job compiles it.
      # go.mod is the single source of the version, as every other workflow here
      # does it.
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # go.mod's version is a FLOOR, not the toolchain (CLAUDE.md, "Build / test / gate").
          check-latest: true

      - name: Gather the data change
        id: gather
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_INPUT: ${{ github.event.inputs.pr }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            PR="$PR_INPUT"
            # Belt and braces behind the input's `type: number`: a REST dispatch
            # is not guaranteed to type check, and this reaches gh and git.
            if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
              echo "::error::pr input must be a pull request number; got '${PR}'"
              exit 1
            fi
            BASE_SHA="$(gh pr view "$PR" --json baseRefOid -q .baseRefOid)"
            HEAD_SHA="$(gh pr view "$PR" --json headRefOid -q .headRefOid)"
            git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          else
            PR="$PR_NUMBER"
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

          # Nothing to verify unless data/** actually changed. Decided BEFORE the
          # summary is built, because a metadiff over an empty tranche still
          # prints its header and would read as "there are changes".
          if git diff --quiet "${BASE_SHA}...${HEAD_SHA}" -- 'data/**'; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

          # THE CONTEXT IS AN ENTRY-LEVEL SUMMARY, not a raw diff. The data tree
          # is range-packed: a write re-renders its whole pack and may split it,
          # so a 100-work sync pull request is 136 files and ~68,000 changed
          # lines of which the records are a tiny fraction. The old raw-diff
          # context was then cut to the script's first 200KB, so the model read
          # an arbitrary tenth of the tranche and could not tell. metadiff keys
          # every changed pack's entries by family and slug across the whole
          # tranche at once, so storage churn cancels out and what is left is one
          # line per added or removed record plus a field-level diff per modified
          # one - the WHOLE tranche, inside the budget.
          #
          # The BUILD is inside the `if`, deliberately. Under `set -e` an
          # unguarded `go build` would abort this step before the fallback below
          # is reachable - and a toolchain or compile failure is exactly "the
          # summary could not be built", the case the fallback exists for. `go
          # run` is one invocation that both compiles and runs, so the two
          # failures arrive through the same door.
          if go run ./cmd/metadiff --base "$BASE_SHA" --head "$HEAD_SHA" > context.txt 2> metadiff.err; then
            CONTEXT_FORMAT=summary
          else
            # A summary that could not be built must not silently become a
            # verification of nothing: fall back to the raw diff and SAY SO at the
            # top of the context AND in CONTEXT_FORMAT, so the model is told what
            # it is actually reading - the script's system prompt explains the two
            # shapes differently - and the finding (if any) is judged on the right
            # basis.
            echo "::warning::metadiff failed; falling back to the raw diff context"
            CONTEXT_FORMAT=raw-diff
            git diff --unified=3 "${BASE_SHA}...${HEAD_SHA}" -- 'data/**' > raw.diff
            {
              echo "NOTE: the entry-level summary could not be built for this pull request"
              echo "($(head -c 500 metadiff.err | tr '\n' ' ')). What follows is the RAW"
              echo "unified diff of data/**, truncated to the reviewer's input cap, so it"
              echo "may show only part of the change. Judge only what you can see."
              echo
              cat raw.diff
            } > context.txt
            # Both readings of the change have now failed, so there is no context
            # to verify - and a context.txt holding only the note above would be
            # NON-EMPTY, sail past the script's own empty-file skip and buy a
            # verdict on nothing. A red step is the honest answer: "red means no
            # verdict was reached" is this workflow's stated contract.
            if [ ! -s raw.diff ]; then
              echo "::error::metadiff failed AND the raw diff of data/** is empty, although git reported changes; no context could be built for PR $PR"
              exit 1
            fi
          fi
          echo "context_format=$CONTEXT_FORMAT" >> "$GITHUB_OUTPUT"

          # The slug tombstone table is the one non-pack file in the tree and it
          # is small, so its raw diff is appended verbatim: a retired slug is a
          # judgement call the summary's added/removed pairs should be checked
          # against. (git diff exits 0 whether or not there are differences, so
          # a non-zero status here is a real git failure and should fail the step
          # rather than being swallowed.)
          {
            echo
            echo "===== RAW DIFF OF data/redirects.json ====="
            git diff --unified=3 "${BASE_SHA}...${HEAD_SHA}" -- 'data/redirects.json'
          } >> context.txt

      # Only needed for the preferred CLAUDE_CODE_OAUTH_TOKEN transport (a
      # subscription token authenticates through the CLI, not the raw API). When
      # only ANTHROPIC_API_KEY is set the script uses curl and this is skipped.
      # ubuntu-latest ships Node 20+, so npm is available.
      #
      # `claude --version` is a LIVENESS PROBE, not a formality. For a window
      # around 2026-08-20 this install stopped landing the platform-native
      # binary: npm reported success, `claude` was on PATH, and every invocation
      # exited 1 with "claude native binary not installed" (diagnosed on PR
      # #2251; it resolved itself upstream, so the install line is unchanged).
      # An install whose failure only shows up three steps later, as a "skipped"
      # comment, is what let that outage run silently. The probe moves the next
      # one to the step that causes it.
      - name: Install Claude Code CLI
        if: steps.gather.outputs.has_changes == 'true' && env.HAS_OAUTH == 'true'
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Run AI verification
        if: steps.gather.outputs.has_changes == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Which shape the gather step actually managed to build. The script
          # picks the matching system prompt from it: explaining an entry-level
          # summary in front of a unified diff would tell the model it is reading
          # the whole change when it is reading a truncated part of one.
          CONTEXT_FORMAT: ${{ steps.gather.outputs.context_format }}
        run: bash .github/scripts/ai-verify.sh context.txt verdict.json comment.md

      # Runs even when the verification step FAILED (a skip), so the skip keeps
      # its human-readable trace on the pull request while the job stays red.
      # The comment file is absent only when a step before the script failed, in
      # which case the job log is the whole trace.
      - name: Post the verdict and label the PR
        if: ${{ !cancelled() && steps.gather.outputs.has_changes == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.gather.outputs.pr }}
        run: |
          if [ ! -s comment.md ]; then
            echo "::warning::ai-verify produced no comment - verification did not reach a verdict; see the log above"
            exit 0
          fi
          gh pr comment "$PR" --body-file comment.md || echo "::warning::could not post the ai-verify comment on PR $PR"
          verdict="$(jq -r '.verdict // "skip"' verdict.json 2>/dev/null || echo skip)"
          # A skip CLEARS both outcome labels rather than leaving the previous
          # push's. The label is the same claim as the tick: a PR that passed
          # yesterday and cannot be verified today must not keep a green
          # `ai-verified` badge asserting a verdict this run did not reach.
          # Removing a label fires `unlabeled`, which is not in this workflow's
          # trigger `types`, so this cannot re-fire the job.
          case "$verdict" in
            pass) gh pr edit "$PR" --remove-label ai-flagged --add-label ai-verified || true ;;
            flag) gh pr edit "$PR" --remove-label ai-verified --add-label ai-flagged || true ;;
            *)    gh pr edit "$PR" --remove-label ai-verified --remove-label ai-flagged || true
                  echo "verdict=$verdict; outcome labels cleared" ;;
          esac
