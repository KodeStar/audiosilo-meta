name: route

# Routes an issue an AudioSilo Bridge filed through the AudioSilo GitHub App
# (BRIDGE-PLAN.md Phase 2b) into the intake bot. The routing itself - who is
# routed, the abuse bounds, the denylist, the hold, the re-run guard - lives in
# route-reusable.yml, the one copy this repository and
# KodeStar/audiosilo-meta-community both call; this file passes this
# repository's two forms and its cap, then calls intake.yml in the same run
# (a label applied with GITHUB_TOKEN starts no `labeled` run of its own).
on:
  issues:
    types: [opened]

permissions: {}

jobs:
  route:
    # The called job may use at most what this job grants.
    permissions:
      contents: read
      issues: write
      pull-requests: read
    # Local path: the same commit as this file, so a change to the routing
    # reaches this repository as it merges.
    uses: ./.github/workflows/route-reusable.yml
    with:
      # "[work] " is the add-work form and "[corrections] " the
      # correction-batch form.
      routes: |
        work data:add-work
        corrections data:correction-batch
      # Open App-filed issues one GitHub user may have here before the next is
      # held (the community repository allows 50: a Bridge files a characters
      # and a recaps issue per book).
      cap: 25

  intake:
    needs: route
    if: needs.route.outputs.decision == 'route'
    # The called workflow's jobs may use at most what this job grants: the
    # intake job's own three (its rebase job never runs on an issues event).
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/intake.yml
    with:
      issue_number: ${{ github.event.issue.number }}
      template: ${{ needs.route.outputs.label }}
    # INTAKE_PAT, so the bot's pull request triggers CI (see intake.yml), and no
    # other secret.
    secrets:
      INTAKE_PAT: ${{ secrets.INTAKE_PAT }}
