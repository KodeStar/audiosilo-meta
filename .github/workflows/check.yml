name: check

# Validate every pull request and every push to main.
#
# SECURITY: this uses the plain `pull_request` trigger, NOT
# `pull_request_target`, so fork pull requests run with a read-only token and no
# access to secrets. Do not switch to `pull_request_target` (the "pwn request"
# supply-chain pattern) - any privileged follow-up must live in a separate
# workflow that consumes only artifacts.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: read the code, nothing more. No secrets are needed to validate.
permissions:
  contents: read

# One live validation per pull request. The intake sweep force-pushes every open
# bot-intake pull request on each data merge to main, and without a group each
# force-push stacked a fresh full run behind the last - one merge queued a run
# per open intake PR, and a string of merges multiplied that by the number of
# merges. A superseded head's run validates a tree that can no longer be merged,
# so it is cancelled. Pushes to main are never grouped or cancelled (the sha
# group is unique per push): every commit that lands on main gets its own
# complete validation.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # --profile core is what this repository's data root now IS: works, people,
      # series and redirects.json, with the CC BY-SA layer living in
      # KodeStar/audiosilo-meta-community. It is passed explicitly rather than
      # changed as a flag default, because the tools still serve a whole-database
      # tree ("all") and a community-only one. The teeth are the file accounting:
      # under `core` a works-community/ directory that reappears here - a bad
      # merge, a stray revert, a misdirected contribution - is an unrecognized
      # location and a RED check, instead of a family silently re-adopted.
      - name: Validate data (metacheck)
        run: go run ./cmd/metacheck --profile core

      - name: Check canonical formatting (metafmt)
        run: go run ./cmd/metafmt --check --profile core

  # The CROSS-TREE half of validation, which no single-root check can perform.
  #
  # `metacheck --profile core` above judges this repository's tree alone. The
  # rules that span the two repositories - a community sidecar keyed by a work
  # this core does not hold, a key riding a redirect, two sidecars of one kind
  # resolving onto one work - can only be asked where BOTH trees are present, and
  # until now that was only the release build. So a core PR that retired or
  # deleted a sidecar-keyed work went green here and broke the RELEASE STREAM
  # after merge, for everyone, with the fix needing a second PR.
  #
  # This job is the pre-merge half of that same build: the exact composition
  # release.yml performs, run at PR time, failing on a non-zero exit. It should be
  # REQUIRED, not advisory - its whole point is to be the thing that stops the
  # merge.
  #
  # The community checkout is public and read-only (github.token, no secret), and
  # the artifact goes to the runner temp: nothing is published and nothing is
  # cached. It floats on the community repo's `main` deliberately - that is what
  # the release will compose against, so a core change that breaks the pair should
  # go red the moment either side makes it true.
  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout the community layer
        uses: actions/checkout@v4
        with:
          repository: KodeStar/audiosilo-meta-community
          ref: main
          path: community

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compose both trees (metabuild --community)
        # Building rather than only checking is deliberate: the compose rules run
        # inside the loader metabuild drives (check.LoadComposed), so this IS the
        # check, and going all the way to an artifact additionally exercises the
        # builder over the composed catalogue - the same work release.yml does, so
        # a green run here means the release can be cut.
        run: go run ./cmd/metabuild -data data --community community/data -o "$RUNNER_TEMP/meta.sqlite"

  # Build and typecheck the marketing/search site. This job is intentionally
  # unconditional (branch protection can require it), but it self-skips cleanly
  # when site/ is absent, so it stays green before the site lands and gates it
  # once it does. No `paths:` filter - a required check must always report.
  site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for site/
        id: site
        run: |
          if [ -f site/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "site/ not present yet; skipping."
          fi

      - name: Set up Node
        if: steps.site.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install, build, typecheck, and test the site
        if: steps.site.outputs.exists == 'true'
        working-directory: site
        run: |
          yarn install --frozen-lockfile
          yarn build
          yarn run check
          yarn test
