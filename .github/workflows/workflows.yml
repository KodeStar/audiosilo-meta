name: workflows

# Lint the workflows themselves. actionlint type-checks every expression, the
# `uses` references, the `needs`/outputs graph and the shell of each `run` block
# (the image bundles shellcheck and pyflakes, so those run too) - all of which
# this repository leans on heavily: the intake sweep, the release build and
# ai-verify are substantial shell programs living inside YAML, where a typo is
# otherwise found by a failed run on main.
#
# The shell that moved OUT of the YAML into .github/scripts/*.sh is linted here
# too, by shellcheck directly: actionlint reads a `run:` block and never follows
# `bash .github/scripts/x.sh` into the file, so without this step the guard, the
# diff classifier, the webhook sender and ai-verify's body had no lint at all -
# exactly the programs that decide what gets skipped and what gets published.
#
# Paths-filtered: it can only have something to say about these files, so it is
# not a required check and must not pretend to be one.
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # actionlint publishes no action of its own, so this is its official
      # image, pinned by digest exactly as the `uses` above are pinned by sha.
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color

      # The scripts the workflows call out to. Pinned by digest in a `uses:`
      # like actionlint (dependabot's github-actions updater rewrites that form;
      # a digest inside a `run:` string it never sees, and the runner's
      # preinstalled shellcheck moves with the runner image). The -alpine image
      # rather than the scratch one because a step's `args` are not
      # shell-expanded: a spelled-out file list would silently miss the next
      # script added, so the glob is expanded by the image's own shell. -S
      # style, so a new warning class is a red check rather than a note.
      - name: shellcheck the scripts
        uses: docker://koalaman/shellcheck-alpine@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002 # v0.11.0
        with:
          entrypoint: /bin/sh
          args: -c "shellcheck -S style -f gcc .github/scripts/*.sh"
