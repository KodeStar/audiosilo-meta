version: 2

# Keep the four dependency surfaces this repo actually has fresh, without
# turning the pull request list into a dependency feed. Minor and patch updates
# are GROUPED into one pull request per ecosystem per week - they are the bulk of
# the traffic and are reviewed as one bump either way - while a major update
# still arrives on its own, because that is the one that needs reading.
#
# The docker entry is what keeps the Dockerfile's pinned base-image digests from
# going stale: the tags there (node:24-alpine, golang:1.25-alpine, alpine:3.24)
# are pinned by digest for reproducibility, so nothing moves them but this.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      site-minor-and-patch:
        update-types:
          - minor
          - patch
    # vite is a devDependency only because yarn 1 does not install vitest's vite
    # peer; the version that matters is the one astro depends on. A vite major
    # must arrive with the astro major that adopts it, never ahead of it.
    ignore:
      - dependency-name: vite
        update-types:
          - version-update:semver-major

  # The workflows pin every action to a commit sha with the version in a trailing
  # comment; dependabot understands that form and rewrites both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      base-images-minor-and-patch:
        update-types:
          - minor
          - patch
    # Node majors (the Dockerfile's site stage): only the EVEN ones become LTS,
    # so the odd majors are ignored and an even one still arrives as a pull
    # request - to be merged together with check.yml's setup-node
    # `node-version`, which dependabot does not move. The list names odd majors
    # ahead of time because dependabot takes version patterns, not a parity rule;
    # extend it before Node 31 ships.
    #
    # golang: the image's MINOR is the Go language version, which has to move
    # together with go.mod's `go` directive, every setup-go `go-version` and the
    # govulncheck pin - a bump done by hand in one change, never an image-only
    # pull request that builds on a Go the rest of the repository does not use.
    ignore:
      - dependency-name: node
        versions: ["25.x", "27.x", "29.x"]
      - dependency-name: golang
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
