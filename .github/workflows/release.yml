name: release

# Build the SQLite data artifact and publish it as a dated GitHub Release.
# Runs after a change lands on main that can change the ARTIFACT: the data or
# schema it is built from, or the builder that shapes it. The builder counts
# because the artifact is a compiled thing, not a copy: a new index, a
# SchemaVersion bump or a changed column would otherwise sit unreleased until
# some unrelated data edit happened to trigger a build. Since the split that
# reaches further than the builder: the COMPOSE code shapes artifact CONTENT too
# (pkg/check's resolveSidecarKeys re-keys a sidecar through the redirect table,
# and the collision rule decides which member ships), and pkg/pack is the reader
# both roots are walked with. An extra release on a rule tweak costs a build; a
# wrong-keying FIX sitting unreleased costs every consumer.
#
# The artifact is composed from TWO repositories since the community-repo split:
# this one holds the CC0 core (works, people, series, redirects.json) and
# KodeStar/audiosilo-meta-community holds the CC BY-SA layer (works-community).
# The release stream is unchanged - one artifact, one set of assets, cut from
# here - so metaserve, the poller and the webhook see nothing new. What IS new
# is the third trigger: a merge in the community repo cannot push to this one's
# main, so its notify-core.yml sends a `community-data` repository_dispatch
# instead.
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      # data/go.mod is build plumbing, not data (see that file): editing it
      # changes no byte of the artifact, so it cuts no release.
      - "!data/go.mod"
      - "schema/**"
      - "internal/build/**"
      - "cmd/metabuild/**"
      - "pkg/check/**"
      - "pkg/pack/**"
      # The page revision dates (page_revisions) are part of the artifact too.
      - "internal/revision/**"
  # Sent by audiosilo-meta-community's notify-core.yml when community data lands
  # on its main. The payload is only a trigger: this job always composes from
  # both repositories at their current main, exactly as a core-side push does.
  #
  # ONE-TIME MAINTAINER SETUP (the dispatch needs a credential this repo cannot
  # mint for itself - github.token is scoped to the repository it runs in, and
  # the sender is the OTHER repository):
  #   1. Create a fine-grained PAT scoped to KodeStar/audiosilo-meta with the
  #      "Contents: read and write" repository permission, which is what the
  #      POST /repos/{owner}/{repo}/dispatches API requires.
  #   2. Save it as the secret CORE_DISPATCH_TOKEN in
  #      KodeStar/audiosilo-meta-community (Settings -> Secrets and variables ->
  #      Actions).
  # Until that exists, notify-core.yml logs that it is unconfigured and exits 0:
  # community data then reaches a release with the next core-side data or tooling
  # change, or a manual `workflow_dispatch` here. Nothing is lost either way -
  # this workflow always composes from both mains.
  repository_dispatch:
    types: [community-data]
  workflow_dispatch:
    inputs:
      reset_revisions:
        description: >-
          Build WITHOUT the previous release, so every page's revision date
          restarts as unknown. Only for a previous release that cannot be read
          and has to be stepped past - a normal run refuses to release then.
        type: boolean
        default: false

# This workflow publishes a release, so it needs write access to contents.
# Scoped here only - the check workflow stays read-only.
permissions:
  contents: write

# Serialize data releases: every consumer selects the release with the maximum
# published_at, so the runs must publish in the order they started - two
# overlapping runs could otherwise publish the OLDER composition last, and it
# would become the catalogue until the next release. In-progress runs are never
# cancelled. GitHub keeps at most one queued run per group, so a superseded
# queued run gets no dedicated release - harmless, since its changes ride the
# newer queued run's artifact.
concurrency:
  group: data-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Observed up to ~13 minutes (2026-11): two checkouts, metacheck, the
    # compose of a ~2.1 GB artifact and ~570 MB of uploads. The page revision
    # pass adds the previous release's download (~570 MB) and two
    # whole-catalogue digests, the new artifact's and the previous one's: 1m52s
    # each at metabuild's 4 workers over 500k pages on a 20-core Mac. The
    # runner's 4 vCPUs are slower per core and also carry the GC the Mac had
    # spare cores for, so budget up to ~7 minutes each - ~30 minutes in all, an
    # ESTIMATE until the first stamped release is measured (re-size this from
    # that run's log). About twice that. A run cut off here leaves at most a
    # draft, which the next run's identify step deletes before composing again.
    timeout-minutes: 60
    steps:
      - name: Checkout
        # A shallow checkout is enough: git history is no longer load-bearing.
        # Each work and recording carries its own added_at (the importer and the
        # intake bot stamp it; the storage migration backfilled the rest from
        # history one final time), so this workflow no longer walks the log to
        # date anything - a pack file's add-date is not its entries' add-dates.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with git: the release, its tag and its assets
          # all go through gh and the API with GH_TOKEN, and the one later git
          # call - require-on-main.sh's fetch of main - reads a public
          # repository anonymously. So the contents:write token is not left in
          # .git/config for the rest of the job.
          persist-credentials: false

      - name: Checkout the community layer
        # The CC BY-SA half of the database, cloned beside the core tree. Public,
        # so github.token is enough and no secret is involved; shallow for the
        # same reason the core checkout is (git history is not load-bearing -
        # every record carries its own added_at). Pinned to main: a release is
        # always composed from the two mains, whichever side triggered it.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KodeStar/audiosilo-meta-community
          ref: main
          path: community
          persist-credentials: false

      - name: Refuse a manual run off main
        if: github.event_name == 'workflow_dispatch'
        # A data release is cut from main by definition - every consumer selects
        # the newest one by asset presence, so a release published from a branch
        # becomes THE catalogue for everybody the moment it lands. Shared with
        # image.yml's tag guard; the mechanism is in the script's header.
        run: bash .github/scripts/require-on-main.sh "A data release must be composed from main - re-run this workflow with the main ref, or merge the branch first."

      - name: Identify this build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        # WHAT IDENTIFIES A DATA RELEASE IS THE PAIR. The tag was date + the core
        # short sha, which stopped being unique the moment a community merge could
        # trigger a release: a `community-data` dispatch on a day that already
        # released leaves core's HEAD unmoved, so the second run composes a
        # genuinely different artifact under a tag that already exists and
        # `gh release create` fails - and two community merges in one day fail the
        # same way. The tag therefore carries BOTH short SHAs:
        #
        #   data-vYYYY.MM.DD-<core7>-<community7>
        #
        # Consumers are unaffected. Nothing reads the tag's SHAPE: metaserve and
        # every mirror select by ASSET PRESENCE (a non-draft, non-prerelease
        # release carrying meta.sqlite.gz) at the maximum published_at. Older
        # `data-vYYYY.MM.DD-<sha>` releases stay valid and selectable exactly as
        # they are.
        #
        # If that exact tag already exists as a PUBLISHED release, the two trees
        # are byte-for-byte the ones it was composed from - there is genuinely
        # nothing new - so the run SKIPS rather than failing: every step below is
        # guarded on `skip`. A re-dispatch, a re-run and a workflow_dispatch on an
        # unchanged pair are all no-ops that skip the compose (both checkouts
        # still run - the identity needs them - so the saved cost is the build,
        # not the clone) instead of a full
        # compose.
        #
        # A DRAFT under that tag is the OPPOSITE answer. A release is created as a
        # draft and published only once every asset has been verified (see the
        # create step), so a leftover draft is a previous run that died in
        # between: it is deleted and this run composes again. Skipping on one
        # would leave a half-made release nobody can see and that no later run
        # would ever replace, since the tag is a function of the two SHAs.
        #
        # The probe therefore reads the release LISTING rather than the by-tag
        # endpoint: a draft carries no git tag (GitHub creates the tag when the
        # draft is published), so `releases/tags/<tag>` 404s on one, while the
        # listing does include drafts for a token with contents:write.
        #
        # Each rev-parse is ASSIGNED before it is echoed. Inlined as
        # `echo "x=$(git ...)"`, the command substitution's failure is discarded -
        # echo's own exit status is what the shell sees, and `set -e` never fires -
        # so a broken community checkout would publish a release whose recorded
        # community sha is the empty string: unreproducible, and silently so.
        run: |
          set -euo pipefail
          core="$(git rev-parse HEAD)"
          community="$(git -C community rev-parse HEAD)"
          tag="data-v$(date -u +'%Y.%m.%d')-${core:0:7}-${community:0:7}"
          skip=false
          # One page is enough and a failure is NOT tolerated: the listing is
          # newest-first, a leftover draft is at most one run old, and a page
          # holds weeks of this repository's releases - while reading a failed
          # API call as "no such release" would upload a SECOND draft under the
          # same tag, which is the one state nothing downstream can untangle.
          state="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -r --arg t "$tag" '[.[] | select(.tag_name == $t)] as $m
                | if ($m | length) == 0 then "none"
                  elif ($m | any(.draft | not)) then "published"
                  else "draft" end')"
          case "$state" in
            published)
              skip=true
              echo "::notice::${tag} already exists - core is at ${core} and the community layer at ${community}, the same pair that release was composed from. Nothing to build; skipping."
              ;;
            draft)
              echo "::notice::${tag} exists as a DRAFT - a previous run created it and never got as far as publishing it. Deleting it and composing again."
              # Two calls rather than one `--cleanup-tag`: the tag usually does
              # NOT exist (it is created at publish time), so the combined form
              # would fail on the tag after having deleted the release, and a
              # `|| true` around the pair would swallow a failed release delete
              # too. So the release delete is strict and the tag delete - which
              # matters only for a draft that somehow does have one - is
              # best-effort.
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" --silent 2> /dev/null || true
              ;;
          esac
          {
            echo "core=$core"
            echo "community=$community"
            echo "tag=$tag"
            echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.build.outputs.skip != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # .go-version holds the bare MINOR and check-latest resolves it to the
          # newest patch; go.mod's `go` line is a floor, not the toolchain
          # (PACKAGES.md, the `.github/` entry).
          go-version-file: .go-version
          check-latest: true

      - name: Validate data (metacheck)
        if: steps.build.outputs.skip != 'true'
        # The core tree alone, under the profile it now IS. The CROSS-TREE rules
        # (a sidecar keyed by a work the core does not hold, a key riding a
        # redirect, two sidecars of one kind meeting on one work) cannot be asked
        # of one root, so they run in the compose below - which is the
        # authoritative gate, and a red one stops the release.
        run: go run ./cmd/metacheck --profile core

      - name: Download the previous data release
        id: prev
        if: steps.build.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RESET: ${{ inputs.reset_revisions == true }}
        # The previous data release is what this one's page REVISION DATES are
        # carried from (metabuild --previous, internal/revision), so it is
        # fetched before the build.
        #
        # The repo publishes BOTH data releases (data-v*, carrying meta.sqlite.gz)
        # and code/image releases (v*, no data assets), so GitHub's "latest"
        # release can be either. The previous release is therefore the non-draft,
        # non-prerelease release carrying a meta.sqlite.gz asset with the MAXIMUM
        # published_at - by publish time, NOT list position, mirroring
        # LatestData in pkg/release/release.go (its doc comment has the full
        # rationale: the list order is not publish-chronological). A leftover
        # draft is never one. Every page of the listing is read, so a run of code
        # releases cannot hide the last data release.
        #
        # FAIL CLOSED. Building without the previous release would restart every
        # page's date as unknown - silently, for the whole catalogue - so a
        # listing that cannot be read, and an asset that cannot be downloaded,
        # verified against its own published checksum or decompressed, fail the
        # run. An EMPTY answer fails too: data releases exist, and an anomalous
        # listing (an empty page, an asset list the API left out) reads exactly
        # like "none", so building on it would reset every date. The first data
        # release of a fresh repository, and a previous release that is genuinely
        # broken, are both stepped past by a manual run with reset_revisions,
        # which builds without it on purpose.
        run: |
          set -euo pipefail
          if [ "$RESET" = "true" ]; then
            echo "::warning::reset_revisions: building without the previous release; every page's revision date restarts as unknown"
            exit 0
          fi
          prev_tag="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select((.draft or .prerelease) | not) | select(any(.assets[]?; .name == "meta.sqlite.gz")) | "\(.published_at) \(.tag_name)"' \
            | sort | tail -n 1 | cut -d' ' -f2)"
          if [ -z "$prev_tag" ]; then
            echo "::error::no previous data release found; refusing to build without one, which would reset every page's revision date. For the first data release of a repository, run this workflow manually with reset_revisions."
            exit 1
          fi
          mkdir prev
          gh release download "$prev_tag" --repo "$GITHUB_REPOSITORY" --dir prev \
            --pattern meta.sqlite.gz --pattern meta.sqlite.gz.sha256
          # The guard against a truncated or corrupt predecessor (no size or
          # page-count threshold): a mismatch fails the run before metabuild.
          (cd prev && sha256sum --strict -c meta.sqlite.gz.sha256)
          gunzip prev/meta.sqlite.gz
          echo "tag=$prev_tag" >> "$GITHUB_OUTPUT"

      - name: Build SQLite artifact (metabuild)
        if: steps.build.outputs.skip != 'true'
        env:
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        # The two-root compose (check.LoadComposed): -data is the CC0 core and
        # --community is the CC BY-SA layer's own data/. metabuild refuses a
        # --community root holding no sidecars, so a wrong path is a failed
        # release rather than a silently empty community layer.
        # added_at comes from the records themselves; metabuild falls back to
        # sources[].imported_at for anything that carries neither.
        #
        # With a previous release, every page is then dated against it
        # (internal/revision): a page whose content is unchanged keeps its date
        # and a changed or new one is stamped REVISED_AT - the newer of the two
        # composed commits' commit times, so a re-run over the same pair stamps
        # the same instant and the revision rows stay a pure function of their
        # inputs (the artifact as a whole is not: meta(built_at) is the wall clock)
        # (metabuild moves a stamp that is not after the previous release's own
        # to one second past it, so a changed page's date always advances). %ct
        # is a Unix time, which compares without parsing. A commit time in the
        # FUTURE (a skewed clock, a rewritten date) is capped at the wall clock:
        # left alone it would become revisions_at, and the clamp would then hold
        # every later release to one second past it.
        run: |
          set -euo pipefail
          args=(-data data --community community/data -o meta.sqlite)
          if [ -n "$PREV_TAG" ]; then
            core_ct="$(git log -1 --format=%ct)"
            community_ct="$(git -C community log -1 --format=%ct)"
            stamp=$(( core_ct > community_ct ? core_ct : community_ct ))
            now="$(date -u +%s)"
            if [ "$stamp" -gt "$now" ]; then
              echo "::warning::the newest commit time is in the future; stamping the wall clock instead"
              stamp="$now"
            fi
            revised_at="$(date -u -d "@${stamp}" +%Y-%m-%dT%H:%M:%SZ)"
            args+=(--previous prev/meta.sqlite --previous-tag "$PREV_TAG" --revised-at "$revised_at")
          fi
          go run ./cmd/metabuild "${args[@]}"
          # The previous artifact (~2.1 GB) has done its job; free the disk before
          # the compress step writes the new gz beside the new artifact.
          rm -rf prev

      - name: Compress and checksum
        if: steps.build.outputs.skip != 'true'
        # The gz + its checksum are the universal anchor every download is
        # verified against. The checksum of the RAW sqlite verifies a file that
        # was NOT just downloaded through the anchor - metaserve's cache volume
        # adopts an artifact a previous container left only once it matches
        # (metabuild is deterministic, so the same tree hashes the same).
        #
        # Releases up to 2026-11-19 also carried a zstd --patch-from delta
        # against the previous release. It was removed once the artifact passed
        # 2 GB: the zstd CLI refuses a --patch-from base that large, and
        # metaserve declined any patch base over 1 GiB anyway.
        run: |
          set -euo pipefail
          gzip -kf meta.sqlite
          sha256sum meta.sqlite.gz > meta.sqlite.gz.sha256
          sha256sum meta.sqlite > meta.sqlite.sha256

      - name: Create the release as a draft and upload artifacts
        if: steps.build.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
          CORE_SHA: ${{ steps.build.outputs.core }}
          COMMUNITY_SHA: ${{ steps.build.outputs.community }}
        # Uploads the gz anchor and both checksums. The notes name BOTH composed
        # SHAs: the artifact is built from two repositories, so one sha does not
        # identify it.
        #
        # DRAFT FIRST. The release is created invisible and published two steps
        # down, once every asset has been verified, because publishing on
        # creation raced the uploads twice over: a consumer selecting the newest
        # non-draft release carrying meta.sqlite.gz (metaserve's
        # latestDataRelease, every mirror, every CLI consumer) could pick this
        # release while its checksum files were still going up, and a
        # verification that then failed left a broken release visible with
        # nothing but a manual deletion to withdraw it. A draft is invisible to
        # all of them, so neither race exists: the release becomes selectable
        # already complete and already checked.
        #
        # --target is the composed core sha. The tag does not exist yet (GitHub
        # creates it when the draft is published), and without a target it would
        # be cut at whatever main's HEAD is by then rather than at the tree this
        # artifact was actually built from.
        run: |
          set -euo pipefail
          assets=(meta.sqlite.gz meta.sqlite.gz.sha256 meta.sqlite.sha256)
          notes="$(printf 'Automated data release composed from:\n\n- core: KodeStar/audiosilo-meta@%s\n- community: KodeStar/audiosilo-meta-community@%s\n' \
            "$CORE_SHA" "$COMMUNITY_SHA")"
          gh release create "$TAG" \
            --draft \
            --target "$CORE_SHA" \
            --title "$TAG" \
            --notes "$notes" \
            "${assets[@]}"

      - name: Verify the draft's assets
        id: verify
        if: steps.build.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
        # The assets ARE the consumer contract - metaserve, the mirrors and the
        # CLI consumers all select a release by asset presence and then trust
        # the checksums beside it - so an upload that silently truncated or
        # dropped a file is a broken catalogue for everyone, not a broken run.
        # This is why it runs against the DRAFT: nothing can have selected it
        # yet, so a failure here is withdrawn (the step below deletes it) rather
        # than served.
        #
        # The two checksum FILES are downloaded and compared byte-for-byte: they
        # are 80 bytes each and they are what a consumer verifies against, so
        # they are read back exactly as a consumer reads them. `gh release
        # download` resolves a draft by tag - its by-tag REST lookup falls back
        # to a draft search - which is what makes that possible before the
        # release is public. EVERY asset (the ~570MB gz included) is then
        # verified through the release API's own `size` and `digest` fields -
        # GitHub's SHA-256 of the bytes it stored, computed on its side,
        # not something we hand it - so a truncated or dropped upload is caught
        # without pulling half a gigabyte back down the wire to hash locally. A
        # null digest is a FAILURE, not a pass: an API that stopped exposing the
        # field has stopped verifying anything, and silence there is the whole
        # class of bug this step exists for.
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "$TAG" --dir published --clobber \
            --pattern meta.sqlite.gz.sha256 \
            --pattern meta.sqlite.sha256
          cmp meta.sqlite.gz.sha256 published/meta.sqlite.gz.sha256
          cmp meta.sqlite.sha256 published/meta.sqlite.sha256

          # The same asset list the upload step composed.
          assets=(meta.sqlite.gz meta.sqlite.gz.sha256 meta.sqlite.sha256)

          # Read from the release LISTING, not from `releases/tags/<tag>`: the
          # draft has no git tag yet, so the by-tag endpoint 404s on it. The
          # listing carries the same asset objects, `digest` included, and shows
          # drafts to a token with contents:write - the same probe the identify
          # step makes.
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -r --arg t "$TAG" '.[] | select(.tag_name == $t) | .assets[] | "\(.name) \(.size) \(.digest // "null")"' \
            > api-assets.txt
          cat api-assets.txt

          fail=0
          for name in "${assets[@]}"; do
            # Matched on the whole first field: `meta.sqlite.gz` is a prefix of
            # `meta.sqlite.gz.sha256`, so a substring test picks the wrong row.
            line="$(awk -v n="$name" '$1 == n' api-assets.txt)"
            if [ -z "$line" ]; then
              echo "::error::${name} was uploaded but is not on release ${TAG}"
              fail=1
              continue
            fi
            api_size="$(echo "$line" | cut -d' ' -f2)"
            api_digest="$(echo "$line" | cut -d' ' -f3)"
            local_size="$(wc -c < "$name" | tr -d ' ')"
            local_digest="sha256:$(sha256sum "$name" | cut -d' ' -f1)"
            if [ "$api_digest" = "null" ] || [ -z "$api_digest" ]; then
              echo "::error::the release API exposed no digest for ${name}; the published bytes cannot be verified without re-downloading them"
              fail=1
            elif [ "$api_digest" != "$local_digest" ]; then
              echo "::error::${name} digest mismatch: release has ${api_digest}, this run built ${local_digest}"
              fail=1
            fi
            if [ "$api_size" != "$local_size" ]; then
              echo "::error::${name} size mismatch: release has ${api_size} bytes, this run built ${local_size}"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]

      - name: Withdraw the draft if verification failed
        if: failure() && steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
        # The draft is the run's own scratch space until it is published, so a
        # verification that failed for ANY reason - a mismatch, a missing asset,
        # a download that never arrived - takes it away again. Two reasons, both
        # about the next run rather than this one: the tag is a function of the
        # two SHAs, so a re-run composes the SAME tag and would otherwise upload
        # a second draft beside the broken one, and the identify step's cleanup
        # is a backstop for the runs this step cannot reach (a cancelled job, a
        # runner that died), not the normal path. The job still fails - the
        # verify step's status is what decides that.
        #
        # Keyed on the verify step alone, never on `failure()` at large: a
        # publish that failed must NOT reach this, because by then the release
        # may be public.
        run: |
          set -euo pipefail
          echo "::error::verification of ${TAG} failed; deleting the draft so a re-run starts clean"
          # Tolerant on both calls, unlike the identify step's: this one runs on
          # a path that is already failing, and a delete that cannot complete
          # must not replace the verification error with its own.
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" --silent 2> /dev/null || true

      - name: Publish the release
        if: steps.build.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
        # The one step that makes the release exist for consumers, and the last
        # thing that happens to it: every asset is uploaded and every checksum is
        # confirmed by the time this runs, so the release a consumer can select
        # is complete from the instant it becomes selectable. This is also where
        # GitHub creates the git tag, at the --target the create step pinned.
        #
        # The draft flag is READ BACK rather than inferred from gh's exit status:
        # a release still sitting as a draft is invisible to metaserve and to
        # every mirror, which is a silently skipped release rather than a failed
        # one - exactly the kind of quiet that this ordering exists to remove.
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [ "$draft" != "false" ]; then
            echo "::error::${TAG} is still a draft after publishing it (isDraft=${draft})"
            exit 1
          fi
          echo "published ${TAG}"

      - name: Notify metaserve of the new release
        if: steps.build.outputs.skip != 'true'
        env:
          WEBHOOK_URL: ${{ secrets.METASERVE_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.METASERVE_WEBHOOK_SECRET }}
        # This runs after every asset is uploaded AND verified AND the release is
        # published, so the receiver is never woken to a release it cannot trust
        # or cannot see. The receiver re-queries GitHub and verifies the release
        # checksums itself; this signed payload only asks it to refresh. Missing
        # deployment secrets and a failed delivery are both non-fatal - hourly
        # polling is the recovery path. The sender lives in a script because
        # internal/serve's Go tests drive it against the real handler, so the
        # envelope it composes and the envelope webhook.go accepts cannot drift.
        run: bash .github/scripts/notify-release.sh
