name: intake

# Two jobs, both about the bot's own pull requests:
#
#   intake  turns a data issue-form submission into a validated bot pull request
#   rebase  keeps those pull requests mergeable when main moves under them
#
# SECURITY: `intake` runs on the `issues` event, so there is NO fork code
# execution (unlike a fork `pull_request` build) - the only untrusted input is
# the issue body/title and any file the submitter attached. That input is treated
# strictly as DATA: it is written to a file via an environment variable (never
# interpolated into a shell command), parsed by metaissue, and never executed.
# metaissue fetches attachments HTTPS-only from GitHub's user-attachment hosts
# with a size cap. Do not add a step that evals or runs anything derived from the
# issue. `rebase` runs on `push` to main, which is trusted for the same reason
# from the other end: the code it executes is main's - built from main before any
# branch is checked out, never run out of a swept branch's tree - and the only
# branches it rewrites (force-push included) are this repository's own
# bot-intake branches whose change is confined to data/ (see that job).
# A submission is admitted by `labeled`, for its ROUTING label, and re-run by
# `edited`; `opened` is deliberately not a trigger. An issue opened WITH its
# routing label (every issue form, and an API client that may set labels) fires
# that label's `labeled` event as well as `opened`, so admitting both ran intake
# twice per submission and posted every verdict twice (#2406, #2408). And an
# issue opened WITHOUT one has nothing for `opened` to act on: the GitHub API
# silently DROPS labels on issues opened by non-collaborators (the sibling
# audiosilo-sidecars contributor tool creates add-work intake issues over the
# API; its characters/recaps issues now go to KodeStar/audiosilo-meta-community,
# which runs its own intake), so such an issue arrives label-less, and it is the
# maintainer applying the routing label later - a `labeled` event, never an
# `opened` or `edited` one - that admits it. The job-level `if` below narrows
# `labeled` to genuine routing labels.
#
# The third door is `workflow_call`, from route.yml: an issue an AudioSilo Bridge
# filed through the AudioSilo GitHub App arrives label-less for the reason above,
# and route.yml labels it with GITHUB_TOKEN - which starts no workflow (GitHub's
# recursion guard), so no `labeled` run follows. route.yml therefore calls this
# workflow in the same run, passing the issue and the routing label it applied.
# In a called run the event is still route.yml's (`issues`/`opened`), so the
# issue payload below is that issue's AS OPENED: its label set predates the
# routing label, which is why `template` is an input rather than read from the
# payload, and its body predates any edit, which is why a called run reads the
# body through the API instead.
on:
  issues:
    types: [edited, labeled]
  workflow_call:
    inputs:
      issue_number:
        description: The issue to compose; must be the issue whose `opened` event started the caller.
        type: number
        required: true
      template:
        description: The routing label the caller applied (data:add-work, data:correction-batch, ...).
        type: string
        required: true
    secrets:
      INTAKE_PAT:
        description: The pull-request token (see the create-pull-request step); optional, as on the other doors.
        required: false
  # A merge to main can leave an already-open intake PR conflicting in a pack
  # file, which only a data change can do - but the series-completion bot
  # (GOVERNANCE.md, "Series-completion bot") merges its own pull request ONLY
  # when the head already contains the tip of main, and it carries the
  # bot-intake label so this sweep is what brings it up to date. A docs or
  # tooling merge therefore has to run the sweep too, or the bot's open pull
  # request sits behind main with nothing to rebase it and is recycled after
  # 30 minutes - a whole cycle thrown away. The sweep is cheap when no bot
  # branch is open, so the trigger is every push to main.
  push:
    branches: [main]

# Least privilege at the workflow level is "nothing"; each job takes what it
# needs (issues: write is the intake job's alone - the rebase job never touches
# an issue).
permissions: {}

# Serialize runs per issue, and separately serialize the rebase sweep: two
# sweeps at once would race on the same branches and on --force-with-lease. The
# issue-number expression is empty for a push, so without the conditional both
# would share one accidental "intake-" group.
# Nothing is ever cancelled in flight: creating an issue with both `data` and
# `data:<template>` emits a `labeled` event for each at once, and the generic
# `data` one is intentionally skipped by the job-level guard below - with
# cancel-in-progress it would cancel the run that opens the pull request.
#
# That is not the whole of it, because GitHub keeps at most ONE PENDING run per
# group and a newer arrival replaces it, in-progress cancellation or not. So an
# event the job-level `if` will skip - a label that is not a routing label, the
# outcome label the last step applies, an edit to an issue with no `data:` label -
# queued behind a running intake would cancel a REAL run waiting behind it, and
# the submission would sit there with no pull request and no comment. Skipped
# events therefore get their own `-noop` group, ai-verify.yml's pattern. The
# condition below is a VERBATIM copy of the intake job's `if` (its call and
# `issues` halves), so keeping the two in step is a matter of keeping them
# identical. A called run shares the issue's `run` group with a later edit's.
concurrency:
  group: >-
    ${{ github.event_name == 'push' && 'intake-rebase' || format('intake-{0}-{1}', github.event.issue.number,
    (
      (
        inputs.issue_number > 0 &&
        inputs.issue_number == github.event.issue.number
      ) || github.event_name == 'issues' && (
      (
        github.event.action == 'edited' &&
        contains(join(github.event.issue.labels.*.name), 'data:')
      ) || (
        github.event.action == 'labeled' &&
        startsWith(github.event.label.name, 'data:') &&
        github.event.label.name != 'data:invalid' &&
        github.event.label.name != 'data:needs-human' &&
        github.event.label.name != 'data:duplicate'
      ))
    ) && 'run' || 'noop') }}
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    # Observed up to ~23 minutes: a library import loads the whole tree several
    # times (metaissue, the libex fill, metafmt, metacheck). Twice that, so a
    # large import is never cut off mid-write while a hung libex call still is.
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
    # Only act on issues carrying a data-routing label (data:add-work, etc.).
    # For an edit we check the issue's current label set; for a `labeled`
    # event we instead gate on the label just added (github.event.label.name), and
    # EXCLUDE the three outcome labels this workflow applies at the end
    # (data:invalid / data:needs-human / data:duplicate). Without that exclusion the
    # workflow's own outcome-labeling (the non-ok step below) would re-fire a
    # `labeled` run - a duplicate intake + duplicate comment - for every non-ok
    # verdict. A genuine routing label (data:add-work, data:add-recording, ...)
    # starts with `data:` but is none of those outcomes. A CALLED run (route.yml)
    # is admitted for the issue that started its caller and no other: the steps
    # read that issue from the event payload. The concurrency group at the top of
    # the file carries a verbatim copy of this condition.
    if: >-
      (
        inputs.issue_number > 0 &&
        inputs.issue_number == github.event.issue.number
      ) || github.event_name == 'issues' && (
      (
        github.event.action == 'edited' &&
        contains(join(github.event.issue.labels.*.name), 'data:')
      ) || (
        github.event.action == 'labeled' &&
        startsWith(github.event.label.name, 'data:') &&
        github.event.label.name != 'data:invalid' &&
        github.event.label.name != 'data:needs-human' &&
        github.event.label.name != 'data:duplicate'
      ))
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Nothing here runs git against the remote with this token:
          # create-pull-request sets its own credential from its `token` input,
          # and everything else is gh with GH_TOKEN.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # .go-version holds the bare MINOR and check-latest resolves it to the
          # newest patch; go.mod's `go` line is a floor, not the toolchain
          # (PACKAGES.md, the `.github/` entry).
          go-version-file: .go-version
          check-latest: true

      - name: Dump the issue body to a file
        env:
          # Untrusted: written verbatim, never interpolated into a command.
          BODY: ${{ github.event.issue.body }}
          # A called run reads the body as it is NOW, not route.yml's `opened`
          # payload: an edit made before the routing label landed was skipped (no
          # data: label yet), and one made since must not be overwritten by the
          # text it replaced. The payload is the fallback if the read fails.
          CALLED: ${{ inputs.issue_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$CALLED" ] && gh api "repos/${GITHUB_REPOSITORY}/issues/${CALLED}" > "$RUNNER_TEMP/issue.json"; then
            jq -j '.body // ""' "$RUNNER_TEMP/issue.json" > issue-body.md
          else
            printf '%s' "$BODY" > issue-body.md
          fi

      - name: Compose records (metaissue)
        id: run
        # The routing template is derived inside metaissue from the issue's
        # labels (issueform.TemplateFromLabels), so the allowlist lives in ONE
        # place. metaissue always emits a JSON verdict - even when no routing
        # label is present it returns status:invalid - so a data:-labeled issue
        # is never processed silently.
        #
        # --profile core is what makes a SIDECAR submission refuse-and-redirect
        # here rather than compose. The two forms left with the layer, but a label
        # can still arrive without one - a maintainer applying data:recaps by hand,
        # a bookmarked prefill URL, the sibling contributor tool - and under the
        # default profile the composer would happily write a works-community entry
        # into a family this repository does not hold. That is a green-looking bot
        # pull request putting CC BY-SA content in the CC0 repo, permanently
        # unmergeable (CI runs --profile core too). With the flag,
        # issueform.templateBelongsElsewhere refuses it as needs-human and the
        # comment names the community repository's issue chooser - the mirror of
        # the message that sends a core form the other way. The rule is DERIVED
        # from each template's writeFamilies, so it cannot drift from what the
        # composer would actually write.
        #
        # --series-lookup reaches the IMPORT template alone. A personal library
        # export names the series a file is tagged with and, on the two intakes
        # that prompted this, no part number on 97 of 123 series rows - every one
        # of them a work left out of its series with a warning. With the flag the
        # row's ASIN is looked up on the live libex service and the position used
        # only when libex names the SAME series. Best-effort and capped: a libex
        # outage leaves the warnings exactly as they are today, so it can never
        # fail an otherwise good submission.
        #
        # A called run (route.yml) routes on the label its caller applied
        # (CALL_TEMPLATE), since the payload's label set predates it.
        env:
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
          CALL_TEMPLATE: ${{ inputs.template }}
        run: |
          if [ -n "$CALL_TEMPLATE" ]; then
            LABELS="$(jq -cn --arg t "$CALL_TEMPLATE" '[$t]')"
          fi
          go run ./cmd/metaissue --labels "$LABELS" --body issue-body.md --data data --profile core \
            --series-lookup > result.json || {
            echo '{"status":"invalid","files":[],"messages":["metaissue failed to run"]}' > result.json
          }
          cat result.json
          echo "status=$(jq -r .status result.json)" >> "$GITHUB_OUTPUT"
          echo "template=$(jq -r '.template // ""' result.json)" >> "$GITHUB_OUTPUT"

      # A personal library export states no cover and no chapter list, so an
      # import lands with placeholder covers unless something fills them. This
      # is that something: it looks up the USER-LIBRARY records that carry an
      # ASIN but no cover (or no chapters) and enriches them from the live libex
      # service, through the ordinary --enrich pass - same fill-absent rule,
      # same runtime contradiction guard, same libex-import provenance.
      #
      # Bounded to the user-library tier (the flag's default), which is where the
      # gap is: libex-seeded records already carry covers. The set shrinks as it
      # is filled, and --limit caps a single run either way. Best-effort by
      # design: a libex outage prints warnings and leaves the gaps for next time,
      # and `|| true` keeps it from failing an otherwise good import.
      - name: Fill missing covers and chapters from libex
        if: steps.run.outputs.status == 'ok' && steps.run.outputs.template == 'import'
        run: |
          # The worklist goes to the runner temp, never the repo: this step runs
          # with the import's records already written and uncommitted, so
          # anything left in the tree here would be swept into the PR.
          go run ./cmd/metaimport libex-fill --data data --limit 60 \
            --conflicts "$RUNNER_TEMP/libex-fill-conflicts.ndjson" 2>&1 | tee "$RUNNER_TEMP/libex-fill.log" || true
          # metaimport validates the tree it wrote, so these are belt-and-braces.
          # They FAIL the step rather than reverting: the import's own records are
          # uncommitted in this same tree, so `git checkout -- data/` here would
          # throw away the contribution along with the fill. A broken tree should
          # stop the PR, not silently lose half of it.
          go run ./cmd/metafmt --write --profile core
          go run ./cmd/metacheck --profile core

      - name: Build the pull-request body
        id: prbody
        if: steps.run.outputs.status == 'ok'
        env:
          ISSUE: ${{ github.event.issue.number }}
          SUBMITTER: ${{ github.event.issue.user.login }}
        run: |
          # The license layer is classified by metaissue (issueform.licenseLayer)
          # and carried on the result, so this workflow never re-derives it.
          layer="$(jq -r '.license' result.json)"
          {
            echo "Automated from #${ISSUE} (submitted by @${SUBMITTER})."
            echo
            echo "License layer: **${layer}**."
            echo
            # Files is what the pull request will actually carry - the data/
            # changes in the working tree, read AFTER the libex fill step, which
            # can rewrite packs metaissue never listed - not result.json's files.
            # Capped at 50 (an import can touch hundreds of packs; the full list
            # is the pull request's own Files changed tab). NUL-delimited, as the
            # rebase sweep's conflict listing is: porcelain v1 without -z C-quotes
            # a path holding a quote, a backslash or a control character.
            mapfile -d '' -t files < <(git status -z --porcelain --untracked-files=all -- data/ | cut -z -c4- | sort -z)
            echo "Files:"
            for f in "${files[@]:0:50}"; do echo "- \`${f}\`"; done
            if [ "${#files[@]}" -gt 50 ]; then
              echo "- ... and $(( ${#files[@]} - 50 )) more (see the Files changed tab)"
            fi
            echo
            # .messages arrives BOUNDED (issueform.Result.MarshalJSON): a body
            # stops at 65,536 characters; the full list is .all_messages, in the log.
            mapfile -t msgs < <(jq -r '.messages[]?' result.json)
            if [ "${#msgs[@]}" -gt 0 ]; then
              echo "Notes:"
              for m in "${msgs[@]}"; do echo "- ${m}"; done
              echo
            fi
            # A correction batch that left changes for a maintainer keeps its
            # issue open after this merges (the partial step below comments them
            # there), so it is referenced without a closing keyword.
            if [ "$(jq '.needs_human // [] | length' result.json)" -gt 0 ]; then
              echo "Applies part of #${ISSUE}; the rest stays open there for a maintainer."
            else
              echo "Closes #${ISSUE} on merge."
            fi
            echo
            echo "> Composed by the intake bot. A maintainer still reviews and approves before merge."
          } > pr-body.md

      - name: Open the pull request
        id: cpr
        if: steps.run.outputs.status == 'ok'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          # A PR created with the default GITHUB_TOKEN triggers NO pull_request
          # workflows (GitHub's recursion guard), so the required "check" gate
          # never runs and the PR is unmergeable until a human pushes to it or
          # closes/reopens it. INTAKE_PAT is a fine-grained PAT (this repo only,
          # Contents + Pull requests read/write) whose PRs trigger CI normally;
          # the github.token fallback keeps intake working (degraded) if the
          # PAT is missing or expired.
          token: ${{ secrets.INTAKE_PAT || github.token }}
          base: main
          # Only the data tree belongs in an intake PR - without this the action
          # commits the whole working tree, including this job's scratch files
          # (issue-body.md, result.json, pr-body.md).
          add-paths: data/**
          branch: intake/issue-${{ github.event.issue.number }}
          commit-message: "intake: issue #${{ github.event.issue.number }} (${{ steps.run.outputs.template }})"
          title: "[intake] ${{ github.event.issue.title }}"
          body-path: pr-body.md
          labels: |
            data
            bot-intake
          delete-branch: true

      # A correction batch applies what it can and leaves the rest for a
      # maintainer (issueform.Result.NeedsHuman): the pull request carries the
      # applied part, and the remainder is commented here, with the
      # data:needs-human label, so the issue stays in the maintainer's queue
      # after the pull request merges. Every other template's ok verdict has no
      # remainder, so this step is skipped for them.
      - name: Comment the remainder and label the issue (partial)
        if: steps.run.outputs.status == 'ok' && steps.cpr.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          if [ "$(jq '.needs_human // [] | length' result.json)" -eq 0 ]; then
            echo "nothing left for a maintainer"
            exit 0
          fi
          {
            echo "The bot applied what it could${PR:+ in #${PR}}. These changes need a **maintainer** - they can't be applied mechanically:"
            echo
            jq -r '.needs_human[] | "- " + .' result.json
            echo
            echo "_Posted by the intake bot._"
          } > comment.md
          gh issue comment "$ISSUE" --body-file comment.md
          gh issue edit "$ISSUE" --add-label "data:needs-human" || true

      - name: Comment the outcome and label the issue (non-ok)
        if: steps.run.outputs.status != '' && steps.run.outputs.status != 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          STATUS: ${{ steps.run.outputs.status }}
        run: |
          {
            case "$STATUS" in
              duplicate)   echo "This looks like it's **already in the database**." ;;
              needs-human) echo "Thanks! This needs a **maintainer** to finish - it can't be applied mechanically." ;;
              invalid)     echo "This submission couldn't be processed automatically. Please check the details below." ;;
            esac
            echo
            jq -r '.messages[]? | "- " + .' result.json
            echo
            echo "_Posted by the intake bot._"
          } > comment.md
          gh issue comment "$ISSUE" --body-file comment.md
          gh issue edit "$ISSUE" --add-label "data:${STATUS}" || true

  # Keep the bot's own open pull requests mergeable after a merge to main.
  #
  # Records are stored in pack files (PACK-SPEC.md), so two pull requests adding
  # entries in the same slug range touch the same file and the second one
  # conflicts. The resolution is mechanical - three-way merge the entries,
  # re-render canonically - and it is scripted so a maintainer never hand-merges a
  # bot pull request. scripts/pack-union-merge.sh owns the rules (and the cases it
  # refuses); scripts/packmerge_test.go drives it through real rebases, so this
  # workflow is only the sweep around it.
  #
  # Every failure is contained to ONE pull request: the branch is restored, the
  # working tree cleaned, a comment posted, and the sweep moves on. A transport
  # failure (a lost --force-with-lease race, a branch deleted mid-sweep) must not
  # take the remaining pull requests down with it.
  #
  # SECURITY: this job runs on `push` to main with a WRITE token persisted in
  # .git/config (the force-push needs it), and it checks each swept branch out -
  # so nothing it EXECUTES may come from that branch. A branch is selected by
  # the bot-intake LABEL, which is data rather than proof of who wrote the
  # branch, and a checked-out tree's `go run ./cmd/...` or `scripts/...` is that
  # branch's code, not main's. So the tools the loop runs - metafmt, metacheck
  # and the two merge drivers (packjson for the packs, redirectsjson for
  # data/redirects.json) - are built and copied from MAIN into the
  # runner temp before the first branch is touched, and a branch is swept at all
  # only when it is the same-repository head of a pull request into main whose
  # every commit, and whose whole diff against main, writes only regular files
  # plainly named data/**/*.json (a fork's is a log line, since it recurs on
  # every push to main; a refused branch is a warning and one comment). The
  # sweep reads main and the branch through refs of its own, by commit id (see
  # main_ref in the loop). Everything left that reads the branch reads it as
  # data, and what the tools say about it is printed with workflow commands
  # stopped (see logged). The one thing in that data metafmt turns into a file
  # name, an entry key at a split's cut, is checked first (see fmt).
  #
  # The step runs under `bash -e` (GitHub's default for a run: with no shell:),
  # which does not reach a command tested by if, elif, ! or ||; every failure
  # the sweep means to survive is caught that way, and anything else stops the
  # step red, which is the safe way round. scripts/intakesweep_test.go runs this
  # step's script against a local origin.
  rebase:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Observed up to ~9 minutes when only a driver merge was checked, 3 to 7 of
    # them the full-history checkout. The loop's cost scales with the number of
    # open bot pull requests: since audiosilo-meta-community#517 EVERY one it
    # rebases gets a `metafmt --check` and a metacheck pass over the whole
    # tree, and check.yml observes 1.5 to 2.5 minutes for metacheck alone, so
    # count about 3 minutes each (an estimate, not yet observed here) and
    # about a dozen pull requests to the bound; three were the most open at
    # once in the weeks before the change. A sweep the bound cuts short leaves
    # the ones it did not reach at the front of the next, but a branch it gave
    # up on stays there too (it is never pushed, so it stays least recently
    # updated): each of those costs its 3 minutes at the head of every sweep
    # until a maintainer deals with it. audiosilo-meta-sync recycles its pull
    # request after 30 minutes behind main (BehindStallAfter), and that one is
    # usually the newest, so the last the sweep reaches. A hung sweep holds
    # the intake-rebase group, which is what the bound is for.
    timeout-minutes: 45
    # Narrower than the intake job's: no issues: write, because nothing here
    # touches an issue.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The rebase needs real history, and the PAT (when present) is what
          # makes the force-push re-trigger the required checks - the same
          # reasoning as the create-pull-request step above. The credential
          # stays PERSISTED here, unlike every other checkout in this
          # repository: the sweep pushes with plain git. That is why the header
          # above keeps branch code out of this job's process tree.
          fetch-depth: 0
          token: ${{ secrets.INTAKE_PAT || github.token }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # .go-version holds the bare MINOR and check-latest resolves it to the
          # newest patch; go.mod's `go` line is a floor, not the toolchain
          # (PACKAGES.md, the `.github/` entry).
          go-version-file: .go-version
          check-latest: true

      - name: Rebase open intake pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        # jq is preinstalled on ubuntu-latest and is what pack-union-merge.sh
        # merges with; a runner image without it would fail the merge step and
        # leave every conflicted pull request for a human, which is the safe way
        # round.
        run: |
          set -uo pipefail
          git config user.name "audiosilo-intake-bot"
          git config user.email "intake-bot@users.noreply.github.com"

          # A fork's branch is not in this repository to rebase or push, and its
          # content is nobody's this workflow can vouch for: logged, never swept.
          #
          # --limit: gh lists 30 by default, and a pull request past the 30th was
          # silently never swept. LEAST RECENTLY UPDATED first: a swept branch's
          # force-push bumps its updatedAt, so a sweep the job timeout cuts short
          # leaves the unswept ones at the FRONT of the next sweep instead of
          # starving the same tail on every push to main. A listing that fails,
          # or is anything but a JSON array (an empty reply reads as no pull
          # requests to jq), is a red step, not "no open intake pull requests":
          # nothing is touched either way, but a green sweep would hide it. The
          # files live in the runner temp, out of the checkout the loop moves.
          # --base main: the loop rebases onto main, so a labelled pull request
          # into any other branch is not this sweep's to rewrite.
          prs="${RUNNER_TEMP}/intake-sweep-prs"
          if ! { gh pr list --state open --base main --label bot-intake --limit 500 \
                --json number,headRefName,headRefOid,isCrossRepository,updatedAt > "${prs}.json" \
              && jq -e 'type == "array"' "${prs}.json" > /dev/null \
              && jq -r '.[] | select(.isCrossRepository) | "::warning::PR #\(.number) is from a fork; the sweep only rebases branches in this repository. Skipped."' "${prs}.json" \
              && jq -r 'sort_by(.updatedAt) | .[] | select(.isCrossRepository | not) | [.number, .headRefName, .headRefOid] | @tsv' "${prs}.json" > "${prs}.tsv"; }; then
            echo "::error::could not list the open intake pull requests; no branch was touched"
            exit 1
          fi
          if [ ! -s "${prs}.tsv" ]; then
            echo "no open intake pull requests"
            exit 0
          fi

          # MAIN's tools, built while main is still the checkout (see the job's
          # SECURITY note): every metafmt/metacheck call and the merge driver
          # below run these copies, never whatever a swept branch's tree holds.
          # Built only now, after the no-pull-requests exit, because the common
          # sweep has nothing to do. A failed build fails the whole sweep (by
          # hand, since the if keeps -e out of it), which is right - without
          # trusted tools there is nothing it may run.
          tools="${RUNNER_TEMP}/intake-sweep-tools"
          if ! mkdir -p "$tools" \
              || ! go build -o "$tools/" ./cmd/metafmt ./cmd/metacheck ./cmd/metaredirectmerge \
              || ! install -m 0755 scripts/pack-union-merge.sh "$tools/pack-union-merge.sh"; then
            echo "::error::could not build the sweep's tools from main; no branch was touched"
            exit 1
          fi

          # .gitattributes routes data/**/*.json to this driver; a driver only
          # runs where it is configured, so this line is what turns it on for the
          # sweep. It matters because git's LINE merge is unsound for a pack file:
          # two branches adding the SAME entry key can have their insertions
          # anchored at different lines, and git then writes the key TWICE - a
          # file pkg/pack refuses and metafmt cannot re-render (issue #1695). The
          # driver merges the entry maps before any of that can happen, and
          # refuses exactly what the recipe below refuses. It names main's copy by
          # absolute path: git runs a driver from the working tree's root, so a
          # relative path would resolve to the replayed branch's script.
          git config merge.packjson.name "three-way merge of pack-file entries"
          git config merge.packjson.driver "'$tools/pack-union-merge.sh' %O %A %B %P"
          # data/redirects.json is no pack, so .gitattributes routes it to a
          # driver of its own: two branches each recording one tombstone touch
          # adjacent sorted lines, which git's line merge stops on. It prints
          # "merged both sides" too. Like every clean rebase, a driver merge of
          # it is followed by the metafmt and metacheck pass below (a merged
          # tombstone may name a record the other side deleted).
          git config merge.redirectsjson.name "three-way merge of the slug tombstone table"
          git config merge.redirectsjson.driver "'$tools/metaredirectmerge' %O %A %B %P"

          # fmt runs main's metafmt over the rebased tree, once every entry key
          # in a pack the branch changed (against main, commit $1) is a slug.
          # metafmt names a split's new pack after the key its cut falls on,
          # and main's pkg/pack refuses one that is no slug; this is the guard
          # in front of it, so a key like a/../../x never reaches a metafmt
          # that would join it into a path outside data/ with the token
          # persisted. metacheck refuses such a key a step later anyway, so
          # nothing mergeable is lost. \A and \z, not ^ and $, which can match
          # at a line break inside a key; a file jq cannot read fails too.
          # main's own packs are not read: main's keys are main's.
          #
          # It ASKS before it writes. `metafmt --check` lists the outstanding
          # work, and a tree with none is left alone: one read of the tree
          # where --write makes two, on every pull request of every sweep.
          # --write refuses, writing nothing and exiting non-zero, an entry
          # two packs hold in DIFFERING copies: a branch's stale split pack
          # moves the bounds, so keeping "the correctly-placed copy" could
          # quietly take back what main merged since
          # (audiosilo-meta-community#517). Which copy stays is a maintainer's
          # call, so that refusal parks the branch like any other failed fmt,
          # its first line naming the entry and both packs.
          fmt() {
            if ! git diff -z --name-only --diff-filter=d "$1" -- data \
                | xargs -0 -r jq -n -e '[inputs | .entries | objects | keys_unsorted[] | test("\\A[a-z0-9-]+\\z")] | all' > /dev/null; then
              echo "metafmt: an entry key the branch brings is not a slug, or a file it changes is not JSON; metafmt was not run"
              return 1
            fi
            "$tools/metafmt" --check --profile core && return 0
            "$tools/metafmt" --write --profile core
          }

          # restore returns the checkout to a clean copy of main. `git clean` is
          # not optional: metafmt --write can CREATE pack files before metacheck
          # rejects the tree, and an untracked file left behind would be
          # committed onto the next pull request in the sweep.
          restore() {
            git rebase --abort 2>/dev/null || true
            git checkout --quiet --force main 2>/dev/null || true
            git clean -fdq data 2>/dev/null || true
          }

          # The sweep's own login, so comment_once counts only the markers the
          # bot itself posted: anyone can write a marker into a comment, and one
          # a contributor pasted must not mute the bot. Resolved once, through
          # GraphQL's viewer, which answers for the workflow token and a PAT
          # alike (GET /user refuses an installation token); a trailing "[bot]"
          # is dropped on both sides, since REST and GraphQL spell a bot's login
          # differently. Unresolved, the marker alone decides, with a warning:
          # a comment repeated on every push is the failure this exists to end.
          self_login="$(gh api graphql -f query='query { viewer { login } }' --jq '.data.viewer.login')" || self_login=""
          self_login="${self_login%"[bot]"}"
          if [ -z "$self_login" ]; then
            echo "::warning::could not resolve the sweep's own login; a marker in anyone's comment counts as already posted"
          fi

          # comment_once says something to a pull request ONCE: the sweep's
          # verdicts recur on every push to main, so each comment carries a
          # hidden marker ($2) and is not posted again while a comment of the
          # sweep's own bears it. A comment listing that fails, or cannot be
          # read, is not taken as "none yet" - that way round would comment on
          # every push.
          comment_once() {
            local comments found=0
            if ! comments="$(gh pr view "$1" --json comments)"; then
              echo "::warning::could not read the comments on PR #$1; not commenting"
              return
            fi
            # || keeps -e off jq's "not found" (1), which a bare status read
            # after it would not: the step used to stop there, red, before the
            # first comment of any kind was posted.
            printf '%s' "$comments" | jq -e --arg me "$self_login" --arg marker "$2" \
              'any(.comments[]; ($me == "" or ((.author.login // "") | sub("\\[bot\\]$"; "")) == $me) and ((.body // "") | contains($marker)))' > /dev/null \
              || found=$?
            if [ "$found" -eq 0 ]; then
              return
            elif [ "$found" -ne 1 ]; then
              echo "::warning::could not read the comments on PR #$1; not commenting"
              return
            fi
            gh pr comment "$1" --body "$2
          $3" \
              || echo "::warning::could not comment on PR #$1"
          }

          # logged prints a log the swept branch's data reached (the replay's,
          # a driver's or a tool's output) with workflow commands stopped, as
          # check-verdict.sh does for job logs: a record key or field can carry
          # a newline and then a line the runner would act on (an ::error::
          # annotation, a mask, a stop of its own). The resume token is made up
          # after the log was written, on a line of its own, and from the
          # kernel's random source rather than $RANDOM alone: a sweep prints
          # one token per log into a job log anyone can watch as it runs, bash's
          # generator can be run forward from two of them, and a branch pushed
          # mid-sweep is fetched only when its turn comes.
          logged() {
            local resume
            resume="intake-sweep-log-$$-$RANDOM-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            echo "::stop-commands::${resume}"
            cat "$1"
            echo
            echo "::${resume}::"
          }

          # noted runs one of the sweep's steps with its output kept in the job
          # log, and on failure leaves in `detail` the one line that failure is
          # best told apart by: the first line matching the ERE $1 (empty: the
          # first line at all), else the last. The detail rides in the failure
          # reason the comment marker digests, so a different cause on the same
          # branch head is news rather than muted by the last one. Backticks,
          # angle brackets and @ are dropped (the line is pasted into a comment,
          # and must neither break its markdown, spell a marker nor mention
          # anyone) and it is capped. The comment quotes the whole reason in one
          # code span, which the dropped backticks leave nothing to close, so a
          # link, an image, a bare URL or a #reference in the tool's line stays
          # text under the bot's name.
          noted() {
            local pattern="${1:-.}" out status
            shift
            out="$(mktemp)"
            "$@" > "$out" 2>&1
            status=$?
            logged "$out"
            detail=""
            if [ "$status" -ne 0 ]; then
              detail="$(grep -E -m 1 -- "$pattern" "$out" || grep -v '^[[:space:]]*$' "$out" | tail -n 1)"
              detail="$(printf '%s' "$detail" | tr -d '\r`<>@' | cut -c 1-200)"
            fi
            rm -f "$out"
            return "$status"
          }

          # refuse leaves a pull request the sweep will not touch, and says why
          # under a FIXED marker: the refusal is about what the branch is, so
          # one note covers it whatever happens next.
          refused_marker="<!-- intake-sweep:not-rebased -->"
          # shown renders the branch-controlled paths a refusal names: five at
          # most, each cut short and in a code span of its own, with every
          # character outside [A-Za-z0-9._/ -] turned into ?, so no file name
          # can make a mention, a link, markup, a marker or a second log line
          # out of the warning or the bot's comment. The sed's backticks are
          # escaped inside double quotes, since a backtick in single quotes is
          # SC2016 to actionlint's shell check (workflows.yml).
          shown() {
            printf '%s\n' "$1" | head -n 5 | cut -c 1-120 \
              | LC_ALL=C tr -c 'A-Za-z0-9._/ \n-' '?' | sed "s/.*/\`&\`/" | paste -sd ' ' -
          }
          refuse() {
            echo "::warning::PR #$1 is not rebased by the sweep: $2"
            comment_once "$1" "$refused_marker" "The intake bot does not rebase this pull request onto \`main\`: $2. Its sweep checks a branch out beside a write token, so it only takes branches whose every commit changes nothing but regular, plainly named JSON files under \`data/\`. A maintainer has to rebase this one (or split the other change out). This note is posted once."
          }

          swept=0
          while IFS=$'\t' read -r number branch listed_sha; do
            echo "::group::PR #${number} (${branch})"
            failure=""
            detail=""
            # The head the rebase attempts: the fetched tip, read before anything
            # moves it. Until the fetch succeeds it is the head GitHub listed, so
            # a failure that stops short of the fetch still names the branch's
            # state and still changes when the branch does.
            attempted_sha="$listed_sha"
            # The sweep's OWN two refs, by full name, and from there commit
            # ids. Never origin/main or a name spelled from the branch: git
            # resolves a short name through refs/tags/ and refs/heads/ before
            # refs/remotes/, so a tag named origin/main, or the local branch
            # `checkout -B` makes for a swept branch named origin/main, would
            # become the base every later pull request is rebased onto. Nor
            # refs/remotes/origin/<branch>, full as it is: a branch named HEAD
            # lands on refs/remotes/origin/HEAD, which git may hold as a
            # pointer at origin/main, so the fetch would write the branch over
            # main's ref and the rules below would compare it with itself. Only
            # this fetch writes refs/intake-sweep/, and each ref is read once,
            # into a commit id, since a tag named like either would make the
            # name ambiguous (which `checkout -B` refuses outright). The fetch
            # names its sources in full too (a remote tag can shadow a branch).
            main_ref="refs/intake-sweep/main"
            head_ref="refs/intake-sweep/head"

            if ! git fetch --quiet origin "+refs/heads/main:${main_ref}" "+refs/heads/${branch}:${head_ref}"; then
              failure="the branch could not be fetched (deleted, or renamed?)"
            elif ! main_sha="$(git rev-parse --verify --quiet "${main_ref}^{commit}")" \
                || ! attempted_sha="$(git rev-parse --verify --quiet "${head_ref}^{commit}")"; then
              attempted_sha="$listed_sha"
              failure="the fetched branch could not be resolved"
            elif ! refused="$( { git diff --no-renames --raw "${main_sha}...${attempted_sha}" \
                  && git log --no-renames --raw --format= "${main_sha}..${attempted_sha}"; } \
                | awk -F'\t' '/^:/ { split($1, mode, " ")
                    if ((mode[2] != "100644" && mode[2] != "000000") || $2 !~ "^data/[A-Za-z0-9._/-]*\\.json$") print $2 }' \
                | sort -u)"; then
              # Unclassifiable is not sweepable: the rule below cannot be asked.
              failure="the branch's changed files could not be listed"
            elif [ -n "$refused" ]; then
              # The branch writes something other than a regular file plainly
              # named data/**/*.json - scripts/, a .gitattributes at any depth,
              # data/go.mod, a symbolic link (metafmt --write would follow one
              # out of the tree to .git/config), a submodule - so rebasing it
              # would put this job's write token beside a checkout of something
              # nobody here reviewed. --raw's second mode column is the new
              # mode (000000: removed). EVERY commit is asked, not only the
              # whole change (three-dot: against the merge base): a file one
              # commit adds and a later one removes is in the tree mid-replay,
              # and a conflict can stop the replay right there. (A merge commit
              # lists nothing, and the rebase drops it.) git quotes a name with
              # a control or non-ASCII character, which then matches nothing.
              # --no-renames: a rename INTO data/ would otherwise list only its
              # destination and hide the path it removed.
              refuse "$number" "it changes something other than a regular file plainly named \`data/**/*.json\` ($(shown "$refused"))"
              echo "::endgroup::"
              continue
            elif git merge-base --is-ancestor "$main_sha" "$attempted_sha"; then
              echo "already on top of main"
              echo "::endgroup::"
              continue
            elif ! git checkout --quiet -B "$branch" "$attempted_sha"; then
              failure="the branch could not be checked out"
            else
              # The rebase output is kept because a CLEAN rebase can still have
              # merged two branches' entries: the driver resolves a pack conflict
              # inside the replay, and says so on the line grepped for below.
              rebaselog="${RUNNER_TEMP:-/tmp}/rebase-${number}.log"
              if git rebase "$main_sha" > "$rebaselog" 2>&1; then
                logged "$rebaselog"
                # EVERY clean rebase is normalized and checked before the push,
                # not only one a driver merged. A replay with no conflict at all
                # can still leave a tree no pack rule allows: a branch that split
                # a pack, rebased onto a main that split the same pack at another
                # cut, keeps its new pack while the shrink of the old one merges
                # away, so the pushed branch held a stale copy of main's entries
                # in a second pack (audiosilo-meta-community#517, re-pushed on
                # every push to main for three days). fmt heals that tree when
                # the copies are identical and gives up on it when they differ
                # (see fmt); metacheck then judges whatever is left. Both drivers
                # print "merged both sides"; the reason names the tree a driver
                # merged as such.
                tree="rebased"
                if grep -q "merged both sides" "$rebaselog"; then
                  tree="merged"
                fi
                if [ "$(git rev-parse --verify --quiet HEAD)" = "$main_sha" ]; then
                  # The replay dropped every commit as already upstream, so
                  # HEAD is main's own tip and the tree is main's: nothing of
                  # the branch's is left to normalize or check, and an amend
                  # here would rewrite MAIN's commit into the branch. Pushed
                  # as it stands, as it was before the tools ran on every
                  # rebase.
                  echo "the rebase left nothing on top of main"
                elif ! noted '^(metafmt:|invalid JSON)' fmt "$main_sha"; then
                  failure="metafmt could not normalize the ${tree} tree${detail:+: ${detail}}"
                elif ! noted '' "$tools/metacheck" --profile core; then
                  failure="metacheck rejected the ${tree} tree${detail:+: ${detail}}"
                elif ! git add data; then
                  # Tested like every other step of the replay: bare, a
                  # failure here would stop the whole step under -e, and a
                  # branch that fails it every time stays least recently
                  # updated, so every pull request behind it would go unswept
                  # on every push to main, with nothing said on any of them.
                  failure="the ${tree} tree could not be staged"
                elif ! git diff --cached --quiet; then
                  GIT_EDITOR=true git commit --amend --no-edit --quiet \
                    || failure="the normalized ${tree} tree could not be committed"
                fi
              else
                logged "$rebaselog"
                # Three-way merge every conflicted pack file, then let metafmt place
                # and re-render the result. Anything else - a conflict outside
                # data/, or one record edited on both sides - is for a person.
                # NUL-delimited and read into an array rather than word-split:
                # a path with a space in it used to arrive as two "files", both
                # unmatched by data/*.json, and the *) arm then reported a
                # conflict outside the data tree that was never there. mapfile,
                # not a `while read` pipeline - the loop assigns `failure`, and a
                # pipeline's subshell would throw that away, turning the
                # fail-safe arm into a silent pass.
                mapfile -d '' -t conflicted < <(git diff -z --name-only --diff-filter=U)
                if [ "${#conflicted[@]}" -eq 0 ]; then
                  # Stopped with NO conflicted path: not a conflict, so nothing
                  # the recipe below resolves, and the working tree is whatever
                  # git left when it gave up. metafmt is not run over that, and
                  # `rebase --continue` is not asked to finish it.
                  failure="the rebase stopped without a conflict to resolve"
                fi
                for f in "${conflicted[@]}"; do
                  case "$f" in
                    # Before data/*.json, which a case pattern's * also matches. With
                    # the driver configured this only re-states its refusal (or a
                    # modify/delete of the whole file, which reaches no driver), so
                    # it fills in the failure reason rather than resolving anything.
                    data/redirects.json) noted '' "$tools/metaredirectmerge" "$f" || failure="the tombstone merge could not resolve ${f}${detail:+: ${detail}}" ;;
                    data/*.json) noted '' "$tools/pack-union-merge.sh" "$f" || failure="the pack merge could not resolve ${f}${detail:+: ${detail}}" ;;
                    *) failure="conflict outside the data tree: ${f}" ;;
                  esac
                  [ -z "$failure" ] || break
                done
                if [ -z "$failure" ] && ! noted '^(metafmt:|invalid JSON)' fmt "$main_sha"; then
                  failure="metafmt could not normalize the merged tree${detail:+: ${detail}}"
                fi
                if [ -z "$failure" ] && ! noted '' "$tools/metacheck" --profile core; then
                  failure="metacheck rejected the merged tree${detail:+: ${detail}}"
                fi
                if [ -z "$failure" ] && ! git add data; then
                  failure="the merged tree could not be staged"
                fi
                if [ -z "$failure" ]; then
                  GIT_EDITOR=true noted '^(error|fatal):' git rebase --continue \
                    || failure="the rebase could not be continued${detail:+: ${detail}}"
                fi
              fi
            fi

            # In full on both sides, and leased on the head the checks above
            # passed: a short name is a refspec git reads (a leading + forces),
            # and a bare lease trusts whatever the remote-tracking ref holds.
            if [ -z "$failure" ] && ! git push --force-with-lease="refs/heads/${branch}:${attempted_sha}" \
                origin "refs/heads/${branch}:refs/heads/${branch}"; then
              # A lost lease means someone else moved the branch while we worked;
              # the next push to main sweeps it again.
              failure="the branch moved while it was being rebased"
            fi

            restore
            if [ -n "$failure" ]; then
              echo "::warning::PR #${number} needs a human: ${failure}"
              # A stuck branch fails the same way on every push to main (#2338
              # collected 17 identical copies), so the comment is posted once
              # per (attempted head, reason): the marker names both, the reason
              # by digest because it can carry a path and a path can close an
              # HTML comment. A new commit on the branch or a different failure
              # (its detail line included) is news and is said again.
              reason="$(printf '%s' "$failure" | sha256sum | cut -c 1-16)"
              comment_once "$number" "<!-- intake-sweep:rebase-failed ${attempted_sha} ${reason} -->" \
                "The intake bot could not rebase this branch onto \`main\` mechanically: \`${failure}\`. It needs a maintainer - see CONTRIBUTING.md, \"When two pull requests touch the same pack\". This note is not repeated until the branch or the reason changes."
            else
              echo "rebased and pushed"
              swept=$((swept + 1))
            fi
            echo "::endgroup::"
          done < "${prs}.tsv"
          echo "rebased ${swept} pull request(s)"
