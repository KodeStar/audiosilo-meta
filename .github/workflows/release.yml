name: release

# Build the SQLite data artifact and publish it as a dated GitHub Release.
# Runs after a change lands on main that can change the ARTIFACT: the data or
# schema it is built from, or the builder that shapes it. The builder counts
# because the artifact is a compiled thing, not a copy: a new index, a
# SchemaVersion bump or a changed column would otherwise sit unreleased until
# some unrelated data edit happened to trigger a build. Since the split that
# reaches further than the builder: the COMPOSE code shapes artifact CONTENT too
# (pkg/check's resolveSidecarKeys re-keys a sidecar through the redirect table,
# and the collision rule decides which member ships), and pkg/pack is the reader
# both roots are walked with. An extra release on a rule tweak costs a build; a
# wrong-keying FIX sitting unreleased costs every consumer.
#
# The artifact is composed from TWO repositories since the community-repo split:
# this one holds the CC0 core (works, people, series, redirects.json) and
# KodeStar/audiosilo-meta-community holds the CC BY-SA layer (works-community).
# The release stream is unchanged - one artifact, one set of assets, one patch
# chain, cut from here - so metaserve, the poller and the webhook see nothing
# new. What IS new is the third trigger: a merge in the community repo cannot
# push to this one's main, so its notify-core.yml sends a `community-data`
# repository_dispatch instead.
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "schema/**"
      - "internal/build/**"
      - "cmd/metabuild/**"
      - "pkg/check/**"
      - "pkg/pack/**"
  # Sent by audiosilo-meta-community's notify-core.yml when community data lands
  # on its main. The payload is only a trigger: this job always composes from
  # both repositories at their current main, exactly as a core-side push does.
  #
  # ONE-TIME MAINTAINER SETUP (the dispatch needs a credential this repo cannot
  # mint for itself - github.token is scoped to the repository it runs in, and
  # the sender is the OTHER repository):
  #   1. Create a fine-grained PAT scoped to KodeStar/audiosilo-meta with the
  #      "Contents: read and write" repository permission, which is what the
  #      POST /repos/{owner}/{repo}/dispatches API requires.
  #   2. Save it as the secret CORE_DISPATCH_TOKEN in
  #      KodeStar/audiosilo-meta-community (Settings -> Secrets and variables ->
  #      Actions).
  # Until that exists, notify-core.yml logs that it is unconfigured and exits 0:
  # community data then reaches a release with the next core-side data or tooling
  # change, or a manual `workflow_dispatch` here. Nothing is lost either way -
  # this workflow always composes from both mains.
  repository_dispatch:
    types: [community-data]
  workflow_dispatch:

# This workflow publishes a release, so it needs write access to contents.
# Scoped here only - the check workflow stays read-only.
permissions:
  contents: write

# Serialize data releases: a patch is generated against the previous release, so
# two quick merges must not both base their delta on the same prev tag (the
# second would then publish a patch from an artifact that is no longer latest).
# In-progress runs are never cancelled. GitHub keeps at most one queued run per
# group, so a superseded queued run gets no dedicated release - harmless, since
# its changes ride the newer queued run's artifact.
concurrency:
  group: data-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # A shallow checkout is enough: git history is no longer load-bearing.
        # Each work and recording carries its own added_at (the importer and the
        # intake bot stamp it; the storage migration backfilled the rest from
        # history one final time), so this workflow no longer walks the log to
        # date anything - a pack file's add-date is not its entries' add-dates.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Checkout the community layer
        # The CC BY-SA half of the database, cloned beside the core tree. Public,
        # so github.token is enough and no secret is involved; shallow for the
        # same reason the core checkout is (git history is not load-bearing -
        # every record carries its own added_at). Pinned to main: a release is
        # always composed from the two mains, whichever side triggered it.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: KodeStar/audiosilo-meta-community
          ref: main
          path: community

      - name: Refuse a manual run off main
        if: github.event_name == 'workflow_dispatch'
        # A data release is cut from main by definition - every consumer selects
        # the newest one by asset presence, so a release published from a branch
        # becomes THE catalogue for everybody the moment it lands. The push and
        # dispatch triggers are already main-only; workflow_dispatch is the one
        # door that takes any ref, so it is checked rather than trusted.
        #
        # The checkout above is shallow (history is not load-bearing here), so
        # main's commits have to be fetched before merge-base can answer. They
        # are fetched TREELESS (--filter=tree:0): the question is reachability,
        # which needs commit objects and nothing else, and a full unshallow of a
        # 133k-work data tree is not what this check is worth.
        run: |
          set -euo pipefail
          # --unshallow is an error on a complete repository, so ask first
          # rather than assume actions/checkout's default fetch-depth.
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --unshallow --filter=tree:0 origin main
          else
            git fetch --no-tags --filter=tree:0 origin main
          fi
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::$(git rev-parse HEAD) is not on origin/main. A data release must be composed from main - re-run this workflow with the main ref, or merge the branch first."
            exit 1
          fi

      - name: Identify this build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        # WHAT IDENTIFIES A DATA RELEASE IS THE PAIR. The tag was date + the core
        # short sha, which stopped being unique the moment a community merge could
        # trigger a release: a `community-data` dispatch on a day that already
        # released leaves core's HEAD unmoved, so the second run composes a
        # genuinely different artifact under a tag that already exists and
        # `gh release create` fails - and two community merges in one day fail the
        # same way. The tag therefore carries BOTH short SHAs:
        #
        #   data-vYYYY.MM.DD-<core7>-<community7>
        #
        # Consumers are unaffected. Nothing reads the tag's SHAPE: metaserve's
        # latestDataRelease and this workflow's own prev-release lookup both select
        # by ASSET PRESENCE (a non-draft, non-prerelease release carrying
        # meta.sqlite.gz) at the maximum published_at, and the patch asset names
        # whatever tag it was built from. Older `data-vYYYY.MM.DD-<sha>` releases
        # stay valid and selectable exactly as they are.
        #
        # If that exact tag already exists, the two trees are byte-for-byte the
        # ones the existing release was composed from - there is genuinely nothing
        # new - so the run SKIPS rather than failing: every step below is guarded
        # on `skip`. A re-dispatch, a re-run and a workflow_dispatch on an
        # unchanged pair are all no-ops that skip the compose (both checkouts
        # still run - the identity needs them - so the saved cost is the build,
        # not the clone) instead of a full
        # compose.
        #
        # Each rev-parse is ASSIGNED before it is echoed. Inlined as
        # `echo "x=$(git ...)"`, the command substitution's failure is discarded -
        # echo's own exit status is what the shell sees, and `set -e` never fires -
        # so a broken community checkout would publish a release whose recorded
        # community sha is the empty string: unreproducible, and silently so.
        run: |
          set -euo pipefail
          core="$(git rev-parse HEAD)"
          community="$(git -C community rev-parse HEAD)"
          tag="data-v$(date -u +'%Y.%m.%d')-${core:0:7}-${community:0:7}"
          skip=false
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            skip=true
            echo "::notice::${tag} already exists - core is at ${core} and the community layer at ${community}, the same pair that release was composed from. Nothing to build; skipping."
          fi
          {
            echo "core=$core"
            echo "community=$community"
            echo "tag=$tag"
            echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.build.outputs.skip != 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # go.mod's `go 1.25.0` is a floor, not the toolchain to build with;
          # without this setup-go pins the release build to that exact patch.
          check-latest: true

      - name: Validate data (metacheck)
        if: steps.build.outputs.skip != 'true'
        # The core tree alone, under the profile it now IS. The CROSS-TREE rules
        # (a sidecar keyed by a work the core does not hold, a key riding a
        # redirect, two sidecars of one kind meeting on one work) cannot be asked
        # of one root, so they run in the compose below - which is the
        # authoritative gate, and a red one stops the release.
        run: go run ./cmd/metacheck --profile core

      - name: Build SQLite artifact (metabuild)
        if: steps.build.outputs.skip != 'true'
        # The two-root compose (check.LoadComposed): -data is the CC0 core and
        # --community is the CC BY-SA layer's own data/. Nothing about the
        # artifact changes - same tables, same SchemaVersion, same deterministic
        # sorted-id inserts - and metabuild refuses a --community root holding no
        # sidecars, so a wrong path is a failed release rather than a silently
        # empty community layer.
        # added_at comes from the records themselves; metabuild falls back to
        # sources[].imported_at for anything that carries neither.
        run: go run ./cmd/metabuild -data data --community community/data -o meta.sqlite

      - name: Download previous release artifact
        id: prev
        if: steps.build.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # The repo publishes BOTH data releases (data-v*, carrying meta.sqlite.gz)
        # and code/image releases (v*, no data assets), so GitHub's "latest"
        # release can be either. The patch base is therefore the non-draft,
        # non-prerelease release carrying a meta.sqlite.gz asset with the MAXIMUM
        # published_at - by publish time, NOT list position, mirroring
        # latestDataRelease in internal/serve/github.go (its doc comment has the
        # full rationale: the list order is not publish-chronological). If it
        # downloads AND gunzips cleanly, export its tag so the compress step
        # generates a binary delta from prev.sqlite.
        # The gunzip stays inside the guard: a corrupt previous asset must skip
        # patch generation, not fail the step (which would block every future
        # release, since each run re-downloads the same latest asset). The
        # first-ever release (or any hiccup) just skips patch generation.
        # Placed after metacheck/metabuild so a failing build never wastes the
        # download.
        run: |
          # -e is on by default (`bash -e {0}`); -u and pipefail are not. The
          # tolerance for a missing or corrupt previous release is DELIBERATE and
          # survives it: the `|| true` catches the API lookup, and the download
          # and gunzip sit in an `if` condition, which errexit never fires on.
          set -euo pipefail
          prev_tag="$(gh api 'repos/${{ github.repository }}/releases?per_page=15' \
            --jq '([.[] | select((.draft or .prerelease) | not) | select(any(.assets[]?; .name == "meta.sqlite.gz"))] | max_by(.published_at) | .tag_name) // empty' \
            2>/dev/null || true)"
          if [ -n "$prev_tag" ] && gh release download "$prev_tag" --pattern meta.sqlite.gz --output prev.sqlite.gz && gunzip prev.sqlite.gz; then
            echo "tag=$prev_tag" >> "$GITHUB_OUTPUT"
          else
            echo "no previous data release; skipping patch generation"
          fi

      - name: Compress and checksum
        if: steps.build.outputs.skip != 'true'
        env:
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        # gz + its checksum stay exactly as before (the universal anchor). Also
        # publish a checksum of the RAW sqlite so a patched artifact can be
        # verified byte-for-byte (metabuild is deterministic). When a previous
        # release was fetched, emit a zstd --patch-from binary delta against it;
        # --single-thread is upstream's recommendation for patch-from quality and
        # --long=31 matches the poller's decoder window (patchWindowLog in
        # internal/serve/github.go - bump both together; CLI consumers also need
        # --long=31 at decompression time). The delta is best-effort: a zstd
        # failure logs a warning and the release ships without it - the gz
        # anchor is never held hostage by patch generation.
        run: |
          # PREV_TAG is always defined (an empty step output is an empty string,
          # not an unset variable), and the best-effort zstd keeps its own `||`
          # recovery, so -u and pipefail change nothing about the tolerances here.
          set -euo pipefail
          gzip -kf meta.sqlite
          sha256sum meta.sqlite.gz > meta.sqlite.gz.sha256
          sha256sum meta.sqlite > meta.sqlite.sha256
          if [ -n "$PREV_TAG" ]; then
            zstd -19 --single-thread --long=31 -f \
              --patch-from=prev.sqlite \
              -o "meta.sqlite.patch.from-${PREV_TAG}.zst" meta.sqlite \
            || { echo "warning: patch generation failed; releasing without a delta"; rm -f "meta.sqlite.patch.from-${PREV_TAG}.zst"; }
          fi

      - name: Create release and upload artifacts
        if: steps.build.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREV_TAG: ${{ steps.prev.outputs.tag }}
          TAG: ${{ steps.build.outputs.tag }}
          CORE_SHA: ${{ steps.build.outputs.core }}
          COMMUNITY_SHA: ${{ steps.build.outputs.community }}
        # Always upload the gz anchor + both checksums; append the binary delta
        # only when the compress step actually produced one (file existence, not
        # PREV_TAG - a failed best-effort zstd run leaves no file behind).
        # The notes name BOTH composed SHAs: the artifact is built from two
        # repositories, so one sha does not identify it.
        run: |
          set -euo pipefail
          assets=(meta.sqlite.gz meta.sqlite.gz.sha256 meta.sqlite.sha256)
          if [ -n "$PREV_TAG" ] && [ -f "meta.sqlite.patch.from-${PREV_TAG}.zst" ]; then
            assets+=("meta.sqlite.patch.from-${PREV_TAG}.zst")
          fi
          notes="$(printf 'Automated data release composed from:\n\n- core: KodeStar/audiosilo-meta@%s\n- community: KodeStar/audiosilo-meta-community@%s\n' \
            "$CORE_SHA" "$COMMUNITY_SHA")"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$notes" \
            "${assets[@]}"

      - name: Verify the published assets
        if: steps.build.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
        # The assets ARE the consumer contract - metaserve, the CLI consumers and
        # the patch chain all select a release by asset presence and then trust
        # the checksums beside it - so an upload that silently truncated or
        # dropped a file is a broken catalogue for everyone, not a broken run.
        # Read them back from the release exactly as a consumer would: both
        # checksum files must be byte-identical to the ones just computed, and
        # the published gz must hash to what its own checksum claims.
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "$TAG" --dir published --clobber \
            --pattern meta.sqlite.gz \
            --pattern meta.sqlite.gz.sha256 \
            --pattern meta.sqlite.sha256
          cmp meta.sqlite.gz.sha256 published/meta.sqlite.gz.sha256
          cmp meta.sqlite.sha256 published/meta.sqlite.sha256
          ( cd published && sha256sum -c meta.sqlite.gz.sha256 )

      - name: Notify metaserve of the new release
        if: steps.build.outputs.skip != 'true'
        env:
          WEBHOOK_URL: ${{ secrets.METASERVE_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.METASERVE_WEBHOOK_SECRET }}
        # This runs after every asset is uploaded AND read back verified, so the
        # receiver is never woken to a release it cannot trust. The receiver
        # re-queries GitHub and verifies the release checksums itself; this
        # signed payload only asks it to refresh. Missing deployment secrets or
        # a delivery failure are non-fatal because hourly polling is retained as
        # the recovery path.
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK_URL" ] || [ -z "$WEBHOOK_SECRET" ]; then
            echo "metaserve webhook secrets are not configured; fallback polling will refresh it"
            exit 0
          fi
          # jq, not printf: inside single quotes those backslashes were LITERAL,
          # so the body was `{\"action\":...}` - not JSON, and webhook.go
          # rejected every delivery with 400. Polling hid it, which is why it
          # survived. jq also escapes the repository name for us.
          payload="$(jq -cn --arg repo "$GITHUB_REPOSITORY" '{action:"published",repository:{full_name:$repo}}')"
          signature="$(PAYLOAD="$payload" python3 - <<'PY'
          import hashlib
          import hmac
          import os

          digest = hmac.new(
              os.environ["WEBHOOK_SECRET"].encode(),
              os.environ["PAYLOAD"].encode(),
              hashlib.sha256,
          ).hexdigest()
          print("sha256=" + digest)
          PY
          )"
          # The signature is computed over exactly these bytes: $payload is what
          # was signed and --data sends it verbatim.
          #
          # Delivery is VERIFIED rather than assumed - the status is what tells a
          # rejected payload (400) apart from an unreachable receiver - but it
          # stays non-fatal: polling is the documented recovery path, so a
          # published release must not be failed by a deployment that is down.
          rc=0
          status="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 15 \
            --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Event: release" \
            --header "X-Hub-Signature-256: $signature" \
            --data "$payload" \
            "$WEBHOOK_URL")" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::metaserve webhook delivery failed (HTTP ${status:-000}, curl exit ${rc}); fallback polling will retry"
          else
            echo "metaserve accepted the release notification (HTTP ${status})"
          fi
